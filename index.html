<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClubPro</title>
    
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ClubPro">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23020617'/><path d='M256 120 L340 280 L440 280 L350 350 L380 460 L256 380 L132 460 L162 350 L72 280 L172 280 Z' fill='%23f59e0b'/><circle cx='256' cy='256' r='40' fill='%23020617'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23020617'/><path d='M256 120 L340 280 L440 280 L350 350 L380 460 L256 380 L132 460 L162 350 L72 280 L172 280 Z' fill='%23f59e0b'/><circle cx='256' cy='256' r='40' fill='%23020617'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; text-align: right; font-size: 12px; overflow-x: hidden; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-amber { background-color: #f59e0b; color: #000; font-weight: 900; }
        .group-header { background: linear-gradient(90deg, rgba(245, 158, 11, 0.12) 0%, transparent 100%); border-right: 3px solid #f59e0b; font-size: 11px; padding: 6px 10px; color: #f59e0b; font-weight: 900; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .transfer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>
    <div id="app"></div>
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const manifestObj = {
            "name": "ClubPro",
            "short_name": "ClubPro",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#020617",
            "theme_color": "#020617",
            "icons": [{
                "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23020617'/><path d='M256 120 L340 280 L440 280 L350 350 L380 460 L256 380 L132 460 L162 350 L72 280 L172 280 Z' fill='%23f59e0b'/><circle cx='256' cy='256' r='40' fill='%23020617'/></svg>",
                "sizes": "192x192 512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const linkTag = document.createElement('link');
        linkTag.rel = 'manifest';
        linkTag.href = manifestURL;
        document.head.appendChild(linkTag);

        const config = {
            apiKey: "AIzaSyD2y4clTGDYnZmmO8Gyg0bXqsyafF-a_GI",
            authDomain: "clubpro-system.firebaseapp.com",
            projectId: "clubpro-system",
            storageBucket: "clubpro-system.firebasestorage.app",
            messagingSenderId: "825897406218",
            appId: "1:825897406218:web:a660e48a120361247934f3"
        };

        firebase.initializeApp(config);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const getToday = () => new Date().toLocaleDateString('sv-SE');

        const allVenues = [
            { id: 'shalvata', name: 'Shalvata', map: 'shalvata.html', waze: 'התערוכה 3, ת"א', wazeLink: 'https://waze.com/ul?q=התערוכה%203%20תל%20אביב&navigate=yes', minP: 250 },
            { id: 'q_gallery', name: 'PULSE TLV', map: 'floorplan.html', waze: 'רוטשילד 19, ת"א', wazeLink: 'https://waze.com/ul?q=רוטשילד%2019%20תל%20אביב&navigate=yes', minP: 200 },
            { id: 'ruki_vverh', name: 'RUKI-VERH', map: null, waze: 'טברסקי 14, ת"א', wazeLink: 'https://waze.com/ul?q=טברסקי%2014%20תל%20אביב&navigate=yes', minP: 150 }
        ];

        let searchDebounceTimer = null;
        let unsubscribeReservations = null;
        let initialSnapshotDone = false;
        let prevResCount = 0;

        let state = {
            role: localStorage.getItem('club_role') || null,
            userName: localStorage.getItem('club_name') || '',
            phone: localStorage.getItem('club_phone') || '',
            allowedVenues: JSON.parse(localStorage.getItem('club_venues') || '[]'),
            venueId: localStorage.getItem('last_venue') || null,
            selectedDate: localStorage.getItem('last_date') || getToday(),
            isDateConfirmed: !!localStorage.getItem('last_date'),
            reservations: [], 
            archiveReservations: [],
            isArchiveLoading: false,
            users: [], 
            isAdding: false, 
            editingId: null,
            transferId: null, 
            showArrived: false, 
            showUsersMGMT: false,
            showArchiveMGMT: false,
            dashboardFilter: '',
            archiveFilterTab: 'all',
            archiveSearchQuery: '',
            archiveExportDate: getToday(),
            formData: { type: 'table', pax: '', clientName: '', clientPhone: '', manualPrice: null, time: '22:30', notes: '', tag: 'רגיל' }
        };

        function playAlertSound() {
            const audio = document.getElementById('alert-sound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio blocked:', e));
            }
        }

        document.addEventListener('click', () => {
            const audio = document.getElementById('alert-sound');
            if (audio && audio.paused && audio.currentTime === 0) audio.load();
        }, { once: true });

        function getAccessibleVenues() {
            if (state.role === 'admin') return allVenues;
            return allVenues.filter(v => (state.allowedVenues || []).includes(v.id));
        }

        // האזנה ממוקדת אך ורק לתאריך ולמועדון שנבחרו - טעינה במהירות שיא
        function bindDayReservations() {
            if (unsubscribeReservations) {
                unsubscribeReservations();
                unsubscribeReservations = null;
            }
            if (!state.venueId || !state.selectedDate) return;

            initialSnapshotDone = false;
            unsubscribeReservations = db.collection('reservations')
                .where('venueId', '==', state.venueId)
                .where('eventDate', '==', state.selectedDate)
                .where('status', '==', 'active')
                .onSnapshot(snap => {
                    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (initialSnapshotDone && docs.length > prevResCount) {
                        playAlertSound();
                    }
                    prevResCount = docs.length;
                    initialSnapshotDone = true;
                    state.reservations = docs;
                    render();
                }, err => {
                    console.error("Query err:", err);
                });
        }

        async function loadArchiveData() {
            state.isArchiveLoading = true;
            render();
            try {
                const snap = await db.collection('reservations')
                    .where('venueId', '==', state.venueId)
                    .where('status', '==', 'active')
                    .limit(300)
                    .get();
                state.archiveReservations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
                console.error("Archive fetch error:", e);
            }
            state.isArchiveLoading = false;
            render();
        }

        function updateState(newData) { 
            const prevVenue = state.venueId;
            const prevDate = state.selectedDate;
            state = { ...state, ...newData }; 
            
            if (state.selectedDate) localStorage.setItem('last_date', state.selectedDate);
            if (state.venueId) localStorage.setItem('last_venue', state.venueId);

            if (state.venueId !== prevVenue || state.selectedDate !== prevDate) {
                bindDayReservations();
            }

            if (newData.showArchiveMGMT === true && state.archiveReservations.length === 0) {
                loadArchiveData();
            }

            render(); 
        }

        function handleSearchInput(val) {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                state.archiveSearchQuery = val;
                render();
                const searchEl = document.getElementById('archive-search');
                if (searchEl) {
                    searchEl.focus();
                    searchEl.selectionStart = searchEl.selectionEnd = searchEl.value.length;
                }
            }, 180);
        }

        function syncFormAndSetType(type) {
            state.formData.clientName = document.getElementById('f-name').value;
            state.formData.clientPhone = document.getElementById('f-phone').value;
            state.formData.pax = document.getElementById('f-pax').value;
            state.formData.time = document.getElementById('f-time').value;
            state.formData.manualPrice = document.getElementById('f-price').value;
            state.formData.notes = document.getElementById('f-notes').value;
            state.formData.tag = document.getElementById('f-tag')?.value || 'רגיל';
            state.formData.type = type;
            render();
        }

        async function saveCurrentBooking() {
            const name = document.getElementById('f-name').value;
            const pax = document.getElementById('f-pax').value;
            const phone = document.getElementById('f-phone').value;
            const time = document.getElementById('f-time').value;
            const price = document.getElementById('f-price').value;
            const notes = document.getElementById('f-notes').value;
            const tag = document.getElementById('f-tag')?.value || 'רגיל';
            if(!name || !pax) return alert("חובה שם וכמות מוזמנים");
            const venue = allVenues.find(v => v.id === state.venueId);
            const data = {
                venueId: state.venueId, 
                name: name.trim(), 
                phone: phone ? phone.trim() : "",
                type: state.formData.type, 
                pax: Number(pax), 
                arrivedPax: state.editingId ? (state.reservations.find(r=>r.id===state.editingId)?.arrivedPax || 0) : 0,
                arrivalStatus: 'pending',
                tag: tag,
                eventDate: state.selectedDate,
                minOrder: Number(price || (pax * venue.minP)), 
                time: time || '22:30', 
                notes: notes ? notes.trim() : "",
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if (state.editingId) { 
                await db.collection('reservations').doc(state.editingId).update(data); 
            } else { 
                data.promoterId = state.phone; 
                data.promoterName = state.userName; 
                data.status = 'active'; 
                data.arrived = false; 
                await db.collection('reservations').add(data); 
            }
            updateState({ isAdding: false, editingId: null });
        }

        async function toggleCheckIn(id, isArrived, totalPax) {
            const newArrived = !isArrived;
            await db.collection('reservations').doc(id).update({
                arrived: newArrived,
                arrivedPax: newArrived ? totalPax : 0,
                arrivalStatus: newArrived ? 'arrived' : 'pending'
            });
        }

        async function updateArrivalSplit(id, totalPax) {
            const val = prompt(`כמה אנשים הגיעו בפועל מתוך ${totalPax}?`, totalPax);
            if (val === null) return;
            const num = Number(val);
            if (isNaN(num) || num < 0 || num > totalPax) return alert("כמות לא תקינה");
            
            await db.collection('reservations').doc(id).update({
                arrived: num > 0,
                arrivedPax: num,
                arrivalStatus: num === totalPax ? 'arrived' : (num > 0 ? 'partial' : 'pending')
            });
        }

        async function setArrivalStatus(id, newStatus, totalPax) {
            const isArr = newStatus === 'arrived' || newStatus === 'partial';
            const res = state.reservations.find(r => r.id === id);
            await db.collection('reservations').doc(id).update({
                arrivalStatus: newStatus,
                arrived: isArr,
                arrivedPax: newStatus === 'arrived' ? (totalPax || res?.pax || 0) : (newStatus === 'pending' || newStatus === 'cancelled' ? 0 : (res?.arrivedPax || 1))
            });
        }

        function exportToWhatsApp(date, list) {
            const vName = allVenues.find(v => v.id === state.venueId)?.name || "Club";
            let text = `*${vName.toUpperCase()} - ${date.split('-').reverse().join('.')}*\n\n`;
            [{id:'table',l:'שולחנות'},{id:'bar',l:'בר'}].forEach(t => {
                const filtered = list.filter(r => r.type === t.id);
                if (filtered.length) {
                    text += `*🏠 ${t.l}:*\n`;
                    filtered.forEach((r, i) => { text += `${i+1}. *${r.name.trim()}* | ${r.pax} איש | ${r.time||'22:30'} | ${r.tableNumber?'שולחן '+r.tableNumber:'₪'+r.minOrder}${r.notes?' | '+r.notes:''}\n`; });
                    text += `\n`;
                }
            });
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function exportNightReport() {
            const venue = allVenues.find(v => v.id === state.venueId);
            const list = state.reservations;
            const totalInvited = list.reduce((a,b)=>a+Number(b.pax||0),0);
            const totalArrived = list.filter(r=>r.arrived).reduce((a,b)=>a+Number(b.arrivedPax || b.pax || 0),0);
            const showRate = totalInvited > 0 ? Math.round((totalArrived / totalInvited) * 100) : 0;
            const totalMoney = list.reduce((a,b)=>a+Number(b.minOrder||0),0);

            let text = `📊 *דוח סוף ערב - ${venue.name}*\n📅 תאריך: ${state.selectedDate.split('-').reverse().join('.')}\n\n`;
            text += `👥 סה"כ מוזמנים: ${totalInvited}\n`;
            text += `✅ סה"כ הגיעו: ${totalArrived} (${showRate}% הגעה)\n`;
            text += `💰 מחזור הזמנות צפוי: ₪${totalMoney.toLocaleString()}\n\n`;
            text += `*חלוקה לפי יחצנים:*\n`;

            const byPromoter = {};
            list.forEach(r => {
                const p = r.promoterName || 'כללי';
                if (!byPromoter[p]) byPromoter[p] = { inv: 0, arr: 0 };
                byPromoter[p].inv += Number(r.pax||0);
                if (r.arrived) byPromoter[p].arr += Number(r.arrivedPax || r.pax || 0);
            });

            Object.keys(byPromoter).forEach(p => {
                text += `▫️ *${p}*: ${byPromoter[p].arr}/${byPromoter[p].inv} איש\n`;
            });

            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function exportToCSV() {
            const venue = allVenues.find(v => v.id === state.venueId);
            const list = state.archiveReservations.length ? state.archiveReservations : state.reservations;
            
            let csvContent = "\uFEFFשם לקוח,טלפון,מוזמנים,הגיעו בפועל,סוג,מינימום הזמנה,שעה,תאריך,יחצן,תגית,הערות\n";
            list.forEach(r => {
                csvContent += `"${r.name}","${r.phone||''}","${r.pax}","${r.arrivedPax||(r.arrived?r.pax:0)}","${r.type}","${r.minOrder||0}","${r.time||''}","${r.eventDate||''}","${r.promoterName||''}","${r.tag||'רגיל'}","${(r.notes||'').replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `ClubPro_${venue.id}_Export.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function sendWhatsAppToClient(id) {
            const res = state.reservations.find(r => r.id === id);
            const venue = allVenues.find(v => v.id === state.venueId);
            let msg = `אהלן ${res.name}, הזמנתך ל-${venue.name} מאושרת ל-${res.pax} אנשים בשעה ${res.time||'22:30'}.📍 ${venue.waze}. ${venue.wazeLink}`;
            
            if (venue.id === 'q_gallery') {
                msg += `\n\n🚗 יש חניון ברוטשילד 1, עלות חנייה חד פעמית 35 ש"ח.\n⏰ הגעה בין 22:00 ל-22:30.\n⚠️ אם יש שינויים בהזמנה או לא מגיעים, יש להודיע מראש.`;
            }
            
            window.open(`https://wa.me/${res.phone.replace(/\D/g,'').replace(/^0/,'972')}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendReengagementWhatsApp(clientName, clientPhone, eventDateStr) {
            if (!clientPhone) return alert("ללקוח זה אין מספר טלפון מעודכן");
            const cleanPhone = clientPhone.replace(/\D/g,'').replace(/^0/,'972');
            const formattedDate = eventDateStr ? eventDateStr.split('-').reverse().join('.') : '';
            let daysText = '';
            if (eventDateStr) {
                const pastDate = new Date(eventDateStr);
                const today = new Date();
                const diffTime = Math.abs(today - pastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                daysText = `לפני ${diffDays} ימים (${formattedDate})`;
            } else {
                daysText = formattedDate;
            }
            const msg = `היי ${clientName}, פעם אחרונה הייתה ${daysText}. מתי נראה אותך שישי הזה?`;
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function exportArchiveDateToWhatsApp() {
            const targetDate = state.archiveExportDate;
            const snap = await db.collection('reservations')
                .where('venueId', '==', state.venueId)
                .where('eventDate', '==', targetDate)
                .where('status', '==', 'active')
                .get();
            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (list.length === 0) return alert(`אין הזמנות בתאריך ${targetDate.split('-').reverse().join('.')}`);
            exportToWhatsApp(targetDate, list);
        }

        function renderRow(res) {
            const venue = allVenues.find(v => v.id === state.venueId);
            const isArrived = !!res.arrived;
            const currentStatus = res.arrivalStatus || (isArrived ? 'arrived' : 'pending');

            const statusColors = {
                arrived: 'text-green-400 bg-green-500/10 border-green-500/30',
                partial: 'text-yellow-400 bg-yellow-500/10 border-yellow-500/30',
                cancelled: 'text-red-400 bg-red-500/10 border-red-500/30',
                late: 'text-purple-400 bg-purple-500/10 border-purple-500/30',
                pending: 'text-amber-400 bg-amber-500/10 border-amber-500/30'
            };

            return `
            <div class="p-3 border-b border-white/5 hover:bg-white/[0.02] transition-all ${isArrived ? 'bg-green-950/10' : ''}">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2.5 flex-1 min-w-0">
                        <button onclick="toggleCheckIn('${res.id}', ${isArrived}, ${res.pax})" 
                                ondblclick="updateArrivalSplit('${res.id}', ${res.pax})" 
                                class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 border transition-transform active:scale-95 ${isArrived ? 'bg-green-500 text-black border-green-400 font-black shadow-lg shadow-green-500/20' : 'bg-white/5 border-white/10 text-slate-400 hover:border-amber-500/50'}">
                            ${isArrived ? '<i data-lucide="check" size="18"></i>' : '<i data-lucide="user-check" size="16"></i>'}
                        </button>
                        
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-black text-white text-sm tracking-wide break-words">${res.name}</span>
                                <span class="text-slate-400 font-bold text-xs">(${res.arrivedPax ? `${res.arrivedPax}/` : ''}${res.pax})</span>
                                ${res.tag && res.tag !== 'רגיל' ? `<span class="text-[8px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.5 rounded-md font-black">${res.tag}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <span class="text-blue-400 font-black text-xs shrink-0 bg-blue-500/10 px-2 py-0.5 rounded-md border border-blue-500/20">${res.time || '22:30'}</span>
                </div>

                <div class="flex items-center justify-between gap-2 pt-1 border-t border-white/[0.04]">
                    <div class="flex items-center gap-2">
                        <select onchange="setArrivalStatus('${res.id}', this.value, ${res.pax})" 
                                class="text-[10px] font-black rounded-lg px-2 py-1 outline-none border cursor-pointer ${statusColors[currentStatus]}">
                            <option value="pending" ${currentStatus==='pending'?'selected':''}>🟡 ממתין</option>
                            <option value="arrived" ${currentStatus==='arrived'?'selected':''}>🟢 הגיע</option>
                            <option value="late" ${currentStatus==='late'?'selected':''}>🟣 מאחר</option>
                            <option value="cancelled" ${currentStatus==='cancelled'?'selected':''}>🔴 ביטול</option>
                        </select>
                        
                        <span class="text-[10px] font-bold ${res.tableNumber ? 'text-amber-400' : 'text-slate-400'}">
                            ${res.tableNumber ? `שולחן ${res.tableNumber} • ` : ''}₪${res.minOrder || 0}
                        </span>
                    </div>

                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="updateState({transferId: '${res.id}'})" class="text-purple-400 p-1.5 hover:bg-purple-500/10 rounded-lg"><i data-lucide="move-horizontal" size="16"></i></button>
                        ${venue.map ? `<button onclick="window.location.href='${venue.map}?assignTo=${res.id}&date=${state.selectedDate}'" class="text-blue-400 p-1.5 hover:bg-blue-500/10 rounded-lg"><i data-lucide="map-pin" size="16"></i></button>` : ''}
                        <button onclick="sendWhatsAppToClient('${res.id}')" class="text-green-400 p-1.5 hover:bg-green-500/10 rounded-lg"><i data-lucide="message-circle" size="16"></i></button>
                        <button onclick="editReservation('${res.id}')" class="text-amber-400 p-1.5 hover:bg-amber-500/10 rounded-lg"><i data-lucide="edit-2" size="16"></i></button>
                        <button onclick="if(confirm('למחוק הזמנה זו?')) db.collection('reservations').doc('${res.id}').update({status:'deleted'})" class="text-red-400 p-1.5 hover:bg-red-500/10 rounded-lg"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                </div>

        function renderArchiveMGMT() {
            const query = state.archiveSearchQuery.trim().toLowerCase();

            const dataSource = state.archiveReservations.length ? state.archiveReservations : state.reservations;

            // חישוב מפת נאמנות מהיר פעם אחת
            const bookingFreqMap = {};
            dataSource.forEach(r => {
                if (r.phone) bookingFreqMap[r.phone.replace(/\D/g, '')] = (bookingFreqMap[r.phone.replace(/\D/g, '')] || 0) + 1;
            });

            const filtered = dataSource.filter(r => {
                if (state.archiveFilterTab === 'vip') {
                    const count = r.phone ? (bookingFreqMap[r.phone.replace(/\D/g, '')] || 0) : 0;
                    if (count < 5 && r.tag !== 'VIP') return false;
                } else if (state.archiveFilterTab === 'dormant') {
                    if (!r.eventDate) return false;
                    const diffDays = Math.ceil(Math.abs(new Date() - new Date(r.eventDate)) / (1000 * 60 * 60 * 24));
                    if (diffDays < 30) return false;
                }

                if (!query) return true;
                const nameMatch = r.name && r.name.toLowerCase().includes(query);
                const phoneMatch = r.phone && r.phone.includes(query);
                const tagMatch = r.tag && r.tag.toLowerCase().includes(query);
                return nameMatch || phoneMatch || tagMatch;

                        <button onclick="updateState({archiveFilterTab: 'vip'})" class="flex-1 py-1.5 rounded-lg text-[10px] font-black ${state.archiveFilterTab==='vip'?'bg-amber-500 text-black':'text-slate-400'}">⭐ VIP</button>

                                    <p class="text-[10px] text-slate-400 font-mono">${u.id}</p>
                                </div>
                                <div class="flex gap-1">
                                    ${!isApproved ? `
                                        <button onclick="approveUser('${u.id}')" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded-lg text-[10px] font-black uppercase shadow transition-all">אשר</button>
                                    ` : ''}
                                    <button onclick="if(confirm('למחוק יחצן זה?')) db.collection('users').doc('${u.id}').delete()" class="text-red-500 hover:bg-red-500/10 p-1.5 rounded-lg transition-colors"><i data-lucide="trash-2" size="16"></i></button>
                                </div>
                            </div>
                            
                            <div class="bg-white/5 p-2 rounded-xl">
                                <p class="text-[9px] text-slate-400 font-bold mb-1 uppercase">מועדונים מורשים:</p>
                                <div class="flex gap-1.5">
                                    ${allVenues.map(v => {
                                        const hasAccess = uVenues.includes(v.id);
                                        return `
                                            <button onclick="toggleUserVenue('${u.id}', '${v.id}')" class="flex-1 py-1 px-1 rounded-lg text-[9px] font-black uppercase border transition-all ${hasAccess ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-transparent border-white/10 text-slate-500'}">
                                                ${v.name} ${hasAccess ? '✓' : ''}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                    ${state.users.length === 0 ? '<p class="p-6 text-center text-slate-500 font-bold text-xs">אין יחצנים רשומים</p>' : ''}
                </div>
            </div>`; 
        }

        async function approveUser(phone) {
            await db.collection('users').doc(phone).update({
                status: 'approved',
                allowedVenues: ['q_gallery']
            });
        }

        async function toggleUserVenue(phone, venueId) {
            const userDoc = await db.collection('users').doc(phone).get();
            if (!userDoc.exists) return;
            let current = userDoc.data().allowedVenues || [];
            if (current.includes(venueId)) {
                current = current.filter(id => id !== venueId);
            } else {
                current.push(venueId);
            }
            await db.collection('users').doc(phone).update({ allowedVenues: current });
        }

        async function loginUser() { 
            const val = document.getElementById('l-in').value.trim(); 
            if (val.toLowerCase() === 'res') { 
                updateState({ role: 'admin', userName: 'Admin', phone: 'ADMIN', allowedVenues: ['shalvata', 'q_gallery', 'ruki_vverh'] }); 
                localStorage.setItem('club_role', 'admin'); 
                localStorage.setItem('club_name', 'Admin'); 
                localStorage.setItem('club_phone', 'ADMIN'); 
                return; 
            } 
            if (val.length >= 10) { 
                const userDoc = await db.collection('users').doc(val).get(); 
                if (!userDoc.exists) {
                    let name = prompt("שם יחצן:"); 
                    if (!name) return; 
                    await db.collection('users').doc(val).set({ 
                        name: name.trim(), 
                        phone: val, 
                        status: 'pending', 
                        allowedVenues: [],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }); 
                    alert("פרטיך נשלחו בהצלחה! המתן לאישור מנהל לפני שתוכל להתחבר.");
                    return;
                } else {
                    const uData = userDoc.data();
                    if (uData.status === 'pending') {
                        return alert("חשבונך עדיין ממתין לאישור מנהל.");
                    }
                    const userAllowed = uData.allowedVenues || [];
                    if (userAllowed.length === 0) {
                        return alert("חשבונך מאושר אך טרם הוגדרו עבורך מועדונים מורשים. פנה למנהל.");
                    }
                    updateState({ 
                        role: 'promoter', 
                        userName: uData.name, 
                        phone: val,
                        allowedVenues: userAllowed,
                        venueId: userAllowed.length === 1 ? userAllowed[0] : null
                    }); 
                    localStorage.setItem('club_role', 'promoter'); 
                    localStorage.setItem('club_name', uData.name); 
                    localStorage.setItem('club_phone', val); 
                    localStorage.setItem('club_venues', JSON.stringify(userAllowed));
                }
            } else {
                alert("יש להזין קוד תקין או מספר טלפון בן 10 ספרות");
            }
        }

        async function logout() { 
            if (unsubscribeReservations) unsubscribeReservations();
            localStorage.clear(); 
            location.reload(); 
        }

        async function moveReservation(resId, newVenueId) { 
            await db.collection('reservations').doc(resId).update({ venueId: newVenueId, tableNumber: firebase.firestore.FieldValue.delete() }); 
            updateState({ transferId: null }); 
        }

        function editReservation(id) { 
            const res = state.reservations.find(r => r.id === id); 
            updateState({ editingId: id, isAdding: true, formData: { type: res.type, pax: res.pax, clientName: res.name, clientPhone: res.phone, manualPrice: res.minOrder, time: res.time||'22:30', notes: res.notes||'', tag: res.tag||'רגיל' } }); 
        }
        
        async function addUserManually() { 
            const name = document.getElementById('u-n').value.trim(); 
            const phone = document.getElementById('u-p').value.trim(); 
            if(!name || phone.length < 10) return alert("יש למלא שם ומספר טלפון תקין (10 ספרות)"); 
            await db.collection('users').doc(phone).set({ 
                name, 
                phone, 
                status: 'approved', 
                allowedVenues: ['q_gallery'],
                createdAt: firebase.firestore.FieldValue.serverTimestamp() 
            }); 
            document.getElementById('u-n').value = ''; 
            document.getElementById('u-p').value = ''; 
        }

        function render() {
            const root = document.getElementById('app');
            if (!state.role) { 
                root.innerHTML = `
                    <div class="h-screen flex items-center justify-center p-4 text-white">
                        <div class="w-full max-w-xs glass p-8 rounded-3xl text-center shadow-2xl border-white/10">
                            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center shadow-lg shadow-amber-500/10">
                                <i data-lucide="crown" size="32" class="text-amber-500"></i>
                            </div>
                            <h2 class="text-2xl font-black mb-1 text-amber-500 italic uppercase">CLUBPRO</h2>
                            <p class="text-[10px] text-slate-400 mb-6 font-bold uppercase tracking-wider">Nightlife Management</p>
                            <input id="l-in" type="text" placeholder="מספר טלפון / קוד" class="w-full bg-white/5 border border-white/10 rounded-xl p-3.5 mb-4 text-center text-white outline-none font-bold text-lg focus:border-amber-500">
                            <button onclick="loginUser()" class="w-full btn-amber py-3.5 rounded-xl uppercase font-black shadow-lg">כניסה</button>
                        </div>
                    </div>`; 
                lucide.createIcons();
                return; 
            }

            const accessibleVenues = getAccessibleVenues();

            if (!state.venueId || !accessibleVenues.some(v => v.id === state.venueId)) { 
                root.innerHTML = `<div class="h-screen p-6 flex flex-col items-center justify-center space-y-4 text-white"><h2 class="text-lg font-black text-amber-500 uppercase italic text-center">בחר מועדון</h2><div class="grid grid-cols-1 gap-3 w-full max-w-xs">${accessibleVenues.map(v => `<div onclick="updateState({venueId: '${v.id}'})" class="glass p-5 rounded-2xl text-center text-lg font-black uppercase border-white/10 cursor-pointer shadow-xl hover:border-amber-500/50 transition-all">${v.name}</div>`).join('')}</div><button onclick="logout()" class="text-slate-500 hover:text-slate-300 font-bold mt-8 underline text-xs tracking-widest flex items-center gap-2 transition-colors"><i data-lucide="log-out" size="14"></i> LOGOUT</button></div>`; 
                lucide.createIcons(); 
                return; 
            }

            if (!state.isDateConfirmed) { 
                root.innerHTML = `<div class="h-screen p-6 flex flex-col items-center justify-center space-y-6 text-white">${accessibleVenues.length > 1 ? `<button onclick="updateState({venueId: null})" class="text-amber-500 font-black text-xs border border-amber-500/30 px-5 py-2 rounded-full uppercase flex items-center gap-1"><i data-lucide="arrow-right" size="14"></i> חזור</button>` : ''}<h2 class="text-xl font-black text-center uppercase">בחר תאריך:</h2><div class="glass p-8 rounded-3xl w-full max-w-xs text-center border-white/5 shadow-2xl"><input type="date" value="${state.selectedDate}" onchange="state.selectedDate = this.value; render();" class="w-full bg-white/10 border border-white/20 rounded-xl p-4 text-white font-black text-center outline-none"><button onclick="updateState({isDateConfirmed: true})" class="w-full btn-amber py-4 rounded-xl mt-6 font-black uppercase shadow-lg">אישור</button></div></div>`; 
                lucide.createIcons(); 
                return; 
            }
            
            const venue = allVenues.find(v => v.id === state.venueId);

            root.innerHTML = `
                <div class="flex flex-col h-screen overflow-hidden text-right text-white relative">
                    ${state.transferId ? `<div class="transfer-overlay"><div class="glass p-6 rounded-3xl w-full max-w-xs text-center space-y-4 border border-white/10"><h3 class="font-black text-amber-500 uppercase">שינוע הזמנה</h3><div class="flex flex-col gap-2">${accessibleVenues.filter(v => v.id !== state.venueId).map(v => `<button onclick="moveReservation('${state.transferId}', '${v.id}')" class="bg-white/10 p-3.5 rounded-xl font-black border border-white/10 active:bg-amber-500 active:text-black uppercase">${v.name}</button>`).join('')}</div><button onclick="updateState({transferId: null})" class="text-slate-400 font-bold pt-2">ביטול</button></div></div>` : ''}
                    <header class="bg-slate-950 p-2.5 border-b border-white/5 flex justify-between items-center shadow-lg">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center">
                                <i data-lucide="crown" size="14" class="text-amber-500"></i>
                            </div>
                            <div class="font-black italic text-base text-amber-500">${venue.name}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="updateState({isDateConfirmed: false})" class="text-slate-300 font-black text-[10px] border border-white/10 px-2.5 py-1.5 rounded-lg uppercase hover:bg-white/5">תאריך</button>
                            ${accessibleVenues.length > 1 ? `<button onclick="updateState({venueId: null, isDateConfirmed: false})" class="text-amber-500 font-black text-[10px] border border-amber-500/50 px-2.5 py-1.5 rounded-lg uppercase hover:bg-amber-500/10">בית</button>` : ''}
                            <button onclick="logout()" class="text-red-400 border border-red-500/30 px-2.5 py-1.5 rounded-lg hover:bg-red-500/10"><i data-lucide="log-out" size="14"></i></button>
                        </div>
                    </header>
                    <main class="flex-1 overflow-y-auto p-2.5 bg-slate-950/50">
                        ${state.showArchiveMGMT ? renderArchiveMGMT() : (state.showUsersMGMT ? renderUsersMGMT() : (state.isAdding ? renderForm() : renderDashboard(state.reservations)))}
                    </main>
                </div>`;
            lucide.createIcons();
        }

        db.collection('users').onSnapshot(snap => { 
            state.users = snap.docs.map(d => ({id:d.id, ...d.data()})); 
            render(); 
        });

        auth.onAuthStateChanged(u => { 
            if(!u) auth.signInAnonymously(); 
            bindDayReservations();
        });

        render();
    </script>
</body>
</html>
