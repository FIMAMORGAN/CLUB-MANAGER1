        function t(key) {
            return (translations[state.lang] && translations[state.lang][key]) || translations['he'][key] || key;

        function setLanguage(lang) {
            state.lang = lang;
            localStorage.setItem('club_lang', lang);
            document.getElementById('html-root').setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', lang);
            render();
        }

        function playAlertSound() {
            const audio = document.getElementById('alert-sound');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
            }
        }

        document.addEventListener('click', () => {
            const audio = document.getElementById('alert-sound');
            if (audio && audio.paused && audio.currentTime === 0) audio.load();
        }, { once: true });

        function getAccessibleVenues() {
            if (state.role === 'admin') return allVenues;
            return allVenues.filter(v => (state.allowedVenues || []).includes(v.id));
        }

        function bindDayReservations() {
            if (unsubscribeReservations) {
                unsubscribeReservations();
                unsubscribeReservations = null;
            }
            if (!state.venueId || !state.selectedDate) return;

            initialSnapshotDone = false;
            unsubscribeReservations = db.collection('reservations')
                .where('venueId', '==', state.venueId)
                .where('eventDate', '==', state.selectedDate)
                .onSnapshot(snap => {
                    const docs = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(r => r.status === 'active');

                    if (initialSnapshotDone && docs.length > prevResCount) {
                        playAlertSound();
                    }
                    prevResCount = docs.length;
                    initialSnapshotDone = true;
                    state.reservations = docs;
                    render();
                }, err => {
                    console.error("Query err:", err);
                });
        }

        async function loadArchiveData() {
            state.isArchiveLoading = true;
            render();
            try {
                const snap = await db.collection('reservations')
                    .where('venueId', '==', state.venueId)
                    .limit(250)
                    .get();
                state.archiveReservations = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(r => r.status === 'active');
            } catch (e) {
                console.error("Archive fetch error:", e);
            }
            state.isArchiveLoading = false;
            render();
        }

        async function exportAllPhonesHistoricalWhatsApp() {
            const venue = allVenues.find(v => v.id === state.venueId);
            state.isExportingAll = true;
            render();

            try {
                const snap = await db.collection('reservations')
                    .where('venueId', '==', state.venueId)
                    .get();

                const docs = snap.docs
                    .map(d => d.data())
                    .filter(r => r.status === 'active' && r.phone && r.phone.replace(/\D/g, '').length >= 9);

                if (docs.length === 0) {
                    alert(state.lang === 'ru' ? `Не найдено клиентов с номерами в клубе ${venue.name}` : `לא נמצאו לקוחות עם מספרי טלפון במועדון ${venue.name}`);
                    state.isExportingAll = false;
                    render();
                    return;
                }

                const clientsMap = {};
                docs.forEach(r => {
                    const cleanP = r.phone.replace(/\D/g, '');
                    if (!clientsMap[cleanP]) {
                        clientsMap[cleanP] = {
                            name: r.name ? r.name.trim() : (state.lang === 'ru' ? 'Без имени' : 'ללא שם'),
                            phone: r.phone.trim(),
                            count: 1,
                            lastDate: r.eventDate || ''
                        };
                    } else {
                        clientsMap[cleanP].count += 1;
                        if ((r.eventDate || '') > clientsMap[cleanP].lastDate) {
                            clientsMap[cleanP].lastDate = r.eventDate;
                        }
                    }
                });

                const uniqueClients = Object.values(clientsMap).sort((a,b) => b.count - a.count);

                let text = state.lang === 'ru'
                    ? `📱 *Полная база контактов - ${venue.name}*\nВсего клиентов с номерами: ${uniqueClients.length}\n\n`
                    : `📱 *מאגר לקוחות מלא - ${venue.name}*\nסה"כ לקוחות עם טלפון: ${uniqueClients.length}\n\n`;

                uniqueClients.forEach((c, idx) => {
                    const formattedDate = c.lastDate ? c.lastDate.split('-').reverse().join('.') : '';
                    const bookingText = state.lang === 'ru' ? 'броней' : 'הזמנות';
                    const lastText = state.lang === 'ru' ? 'последняя' : 'אחרונה';
                    text += `${idx+1}. *${c.name}* | ${c.phone} | ${c.count} ${bookingText}${formattedDate ? ` | ${lastText}: ` + formattedDate : ''}\n`;
                });

                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            } catch(e) {
                console.error("Export all phones error:", e);
                alert(state.lang === 'ru' ? "Ошибка загрузки данных" : "אירעה שגיאה בעת שליפת הנתונים");
            }

            state.isExportingAll = false;
            render();
        }

        async function loadUsersData() {
            state.isUsersLoading = true;
            render();
            try {
                const snap = await db.collection('users').get();
                state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
                console.error("Users fetch error:", e);
            }
            state.isUsersLoading = false;
            render();
        }

        function updateState(newData) { 
            const prevVenue = state.venueId;
            const prevDate = state.selectedDate;
            state = { ...state, ...newData }; 
            
            if (state.selectedDate) localStorage.setItem('last_date', state.selectedDate);
            if (state.venueId) localStorage.setItem('last_venue', state.venueId);

            if (state.venueId !== prevVenue || state.selectedDate !== prevDate) {
                bindDayReservations();
            }

            if (newData.showArchiveMGMT === true && state.archiveReservations.length === 0) {
                loadArchiveData();
            }

            if (newData.showUsersMGMT === true && state.users.length === 0) {
                loadUsersData();
            }

            render(); 
        }

        function handleSearchInput(val) {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                state.archiveSearchQuery = val;
                render();
                const searchEl = document.getElementById('archive-search');
                if (searchEl) {
                    searchEl.focus();
                    searchEl.selectionStart = searchEl.selectionEnd = searchEl.value.length;
                }
            }, 180);
        }

        function syncFormAndSetType(type) {
            state.formData.clientName = document.getElementById('f-name').value;
            state.formData.clientPhone = document.getElementById('f-phone').value;
            state.formData.pax = document.getElementById('f-pax').value;
            state.formData.time = document.getElementById('f-time').value;
            state.formData.manualPrice = document.getElementById('f-price').value;
            state.formData.notes = document.getElementById('f-notes').value;
            state.formData.tag = document.getElementById('f-tag')?.value || 'רגיל';
            state.formData.type = type;
            render();
        }

        async function saveCurrentBooking() {
            const name = document.getElementById('f-name').value;
            const pax = document.getElementById('f-pax').value;
            const phone = document.getElementById('f-phone').value;
            const time = document.getElementById('f-time').value;
            const price = document.getElementById('f-price').value;
            const notes = document.getElementById('f-notes').value;
            const tag = document.getElementById('f-tag')?.value || 'רגיל';
            if(!name || !pax) return alert(state.lang === 'ru' ? "Укажите имя и количество гостей" : "חובה שם וכמות מוזמנים");
            const venue = allVenues.find(v => v.id === state.venueId);
            const data = {
                venueId: state.venueId, 
                name: name.trim(), 
                phone: phone ? phone.trim() : "",
                type: state.formData.type, 
                pax: Number(pax), 
                arrivedPax: state.editingId ? (state.reservations.find(r=>r.id===state.editingId)?.arrivedPax || 0) : 0,
                tag: tag,
                eventDate: state.selectedDate,
                minOrder: Number(price || (pax * venue.minP)), 
                time: time || '22:30', 
                notes: notes ? notes.trim() : "",
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if (state.editingId) { 
                await db.collection('reservations').doc(state.editingId).update(data); 
            } else { 
                data.promoterId = state.phone; 
                data.promoterName = state.userName; 
                data.status = 'active'; 
                data.arrived = false; 
                await db.collection('reservations').add(data); 
            }
            updateState({ isAdding: false, editingId: null });
        }

        async function toggleCheckIn(id, isArrived, totalPax) {
            const newArrived = !isArrived;
            await db.collection('reservations').doc(id).update({
                arrived: newArrived,
                arrivedPax: newArrived ? totalPax : 0
            });
        }

        async function updateArrivalSplit(id, totalPax) {
            const val = prompt(state.lang === 'ru' ? `Сколько человек пришло из ${totalPax}?` : `כמה אנשים הגיעו בפועל מתוך ${totalPax}?`, totalPax);
            if (val === null) return;
            const num = Number(val);
            if (isNaN(num) || num < 0 || num > totalPax) return alert(state.lang === 'ru' ? "Некорректное число" : "כמות לא תקינה");
            
            await db.collection('reservations').doc(id).update({
                arrived: num > 0,
                arrivedPax: num
            });
        }

        function exportToWhatsApp(date, list) {
            const vName = allVenues.find(v => v.id === state.venueId)?.name || "Club";
            let text = `*${vName.toUpperCase()} - ${date.split('-').reverse().join('.')}*\n\n`;
            [{id:'table', l: t('tables')},{id:'bar', l: t('bar')}].forEach(tItem => {
                const filtered = list.filter(r => r.type === tItem.id);
                if (filtered.length) {
                    text += `*🏠 ${tItem.l}:*\n`;
                    filtered.forEach((r, i) => { 
                        const tableStr = r.tableNumber ? `${t('tablePrefix')} ` + r.tableNumber : '₪' + r.minOrder;
                        const peopleWord = state.lang === 'ru' ? 'чел' : 'איש';
                        text += `${i+1}. *${r.name.trim()}* | ${r.pax} ${peopleWord} | ${r.time||'22:30'} | ${tableStr}${r.notes?' | '+r.notes:''}\n`; 
                    });
                    text += `\n`;
                }
            });
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function exportNightReport() {
            const venue = allVenues.find(v => v.id === state.venueId);
            const list = state.reservations;
            const totalInvited = list.reduce((a,b)=>a+Number(b.pax||0),0);
            const totalArrived = list.filter(r=>r.arrived).reduce((a,b)=>a+Number(b.arrivedPax || b.pax || 0),0);
            const showRate = totalInvited > 0 ? Math.round((totalArrived / totalInvited) * 100) : 0;
            const totalMoney = list.reduce((a,b)=>a+Number(b.minOrder||0),0);

            let text = state.lang === 'ru'

                : `📊 *דוח סוף ערב - ${venue.name}*\n📅 תאריך: ${state.selectedDate.split('-').reverse().join('.')}\n\n👥 סה"כ מוזמנים: ${totalInvited}\n✅ סה"כ הגיעו: ${totalArrived} (${showRate}% הגעה)\n💰 מחזור הזמנות צפוי: ₪${totalMoney.toLocaleString()}\n\n*חלוקה לפי יחצנים:*\n`;

            const byPromoter = {};
            list.forEach(r => {
                const p = r.promoterName || (state.lang === 'ru' ? 'Общие' : 'כללי');
                if (!byPromoter[p]) byPromoter[p] = { inv: 0, arr: 0 };
                byPromoter[p].inv += Number(r.pax||0);
                if (r.arrived) byPromoter[p].arr += Number(r.arrivedPax || r.pax || 0);
            });

            Object.keys(byPromoter).forEach(p => {
                const peopleWord = state.lang === 'ru' ? 'чел' : 'איש';
                text += `▫️ *${p}*: ${byPromoter[p].arr}/${byPromoter[p].inv} ${peopleWord}\n`;

        function exportToCSV() {
            const venue = allVenues.find(v => v.id === state.venueId);
            const list = state.archiveReservations.length ? state.archiveReservations : state.reservations;
            
            let csvContent = state.lang === 'ru'
                ? "\uFEFFИмя,Телефон,Гости,Прибыло,Тип,Депозит,Время,Дата,Промоутер,Категория,Примечания\n"
                : "\uFEFFשם לקוח,טלפון,מוזמנים,הגיעו בפועל,סוג,מינימום הזמנה,שעה,תאריך,יחצן,תגית,הערות\n";

            list.forEach(r => {
                csvContent += `"${r.name}","${r.phone||''}","${r.pax}","${r.arrivedPax||(r.arrived?r.pax:0)}","${r.type}","${r.minOrder||0}","${r.time||''}","${r.eventDate||''}","${r.promoterName||''}","${r.tag||'רגיל'}","${(r.notes||'').replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `ClubPro_${venue.id}_Export.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

                    msg = `Привет, ${res.name}! Ваша бронь в ${venue.name} подтверждена на ${res.pax} чел. к ${res.time||'22:30'}.📍 ${venue.address}. ${venue.wazeLink}\n\n🚗 Есть парковка на Ротшильд 1, разовый тариф 35 ₪.\n⏰ Время прибытия с 22:00 до 22:30.\n⚠️ При любых изменениях просьба сообщить заранее.`;
                } else {
                    msg = `אהלן ${res.name}, הזמנתך ל-${venue.name} מאושרת ל-${res.pax} אנשים בשעה ${res.time||'22:30'}.📍 ${venue.address}. ${venue.wazeLink}\n\n🚗 יש חניון ברוטשילד 1, עלות חנייה חד פעמית 35 ש"ח.\n⏰ הגעה בין 22:00 ל-22:30.\n⚠️ אם יש שינויים בהזמנה או לא מגיעים, יש להודיע מראש.`;

                msg = state.lang === 'ru'

        function sendReengagementWhatsApp(clientName, clientPhone, eventDateStr) {
            if (!clientPhone) return alert(state.lang === 'ru' ? "У клиента нет номера телефона" : "ללקוח זה אין מספר טלפון מעודכן");
            const cleanPhone = clientPhone.replace(/\D/g,'').replace(/^0/,'972');
            const formattedDate = eventDateStr ? eventDateStr.split('-').reverse().join('.') : '';
            let daysText = '';
            if (eventDateStr) {
                const pastDate = new Date(eventDateStr);
                const today = new Date();
                const diffTime = Math.abs(today - pastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                daysText = state.lang === 'ru' ? `${diffDays} дней назад (${formattedDate})` : `לפני ${diffDays} ימים (${formattedDate})`;
            } else {
                daysText = formattedDate;
            }
            
            const msg = state.lang === 'ru'
                ? `Привет, ${clientName}! В прошлый раз вы отдыхали у нас ${daysText}. Ждем вас в эту пятницу?`
                : `היי ${clientName}, פעם אחרונה הייתה ${daysText}. מתי נראה אותך שישי הזה?`;

            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function exportArchiveDateToWhatsApp() {
            const targetDate = state.archiveExportDate;
            const snap = await db.collection('reservations')
                .where('venueId', '==', state.venueId)
                .where('eventDate', '==', targetDate)
                .get();
            const list = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(r => r.status === 'active');

            if (list.length === 0) return alert(state.lang === 'ru' ? `Нет броней на дату ${targetDate.split('-').reverse().join('.')}` : `אין הזמנות בתאריך ${targetDate.split('-').reverse().join('.')}`);
            exportToWhatsApp(targetDate, list);
        }

            const bookingFreqMap = {};
            dataSource.forEach(r => {
                if (r.phone) {
                    const cleanP = r.phone.replace(/\D/g, '');
                    bookingFreqMap[cleanP] = (bookingFreqMap[cleanP] || 0) + 1;
                }
            });

            const filtered = dataSource.filter(r => {
                if (state.archiveFilterTab === 'vip') {
                    const count = r.phone ? (bookingFreqMap[r.phone.replace(/\D/g, '')] || 0) : 0;
                    if (count < 5 && r.tag !== 'VIP') return false;
                } else if (state.archiveFilterTab === 'dormant') {
                    if (!r.eventDate) return false;
                    const diffDays = Math.ceil(Math.abs(new Date() - new Date(r.eventDate)) / (1000 * 60 * 60 * 24));
                    if (diffDays < 30) return false;
                }

                if (!query) return true;
                const nameMatch = r.name && r.name.toLowerCase().includes(query);
                const phoneMatch = r.phone && r.phone.includes(query);
                const tagMatch = r.tag && r.tag.toLowerCase().includes(query);

                                            <button onclick="sendReengagementWhatsApp('${r.name.replace(/'/g, "\\'")}', '${r.phone}', '${r.eventDate}')" class="bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-black border border-emerald-500/30 px-2.5 py-1 rounded-lg text-[10px] font-black flex items-center gap-1 transition-all mt-1">

        async function approveUser(phone) {
            await db.collection('users').doc(phone).update({
                status: 'approved',
                allowedVenues: ['q_gallery']
            });
            loadUsersData();
        }

        async function toggleUserVenue(phone, venueId) {
            const userDoc = await db.collection('users').doc(phone).get();
            if (!userDoc.exists) return;
            let current = userDoc.data().allowedVenues || [];
            if (current.includes(venueId)) {
                current = current.filter(id => id !== venueId);
            } else {
                current.push(venueId);
            }
            await db.collection('users').doc(phone).update({ allowedVenues: current });
            loadUsersData();
        }

        async function loginUser() { 
            const val = document.getElementById('l-in').value.trim(); 
            if (val.toLowerCase() === 'res') { 
                updateState({ role: 'admin', userName: 'Admin', phone: 'ADMIN', allowedVenues: ['shalvata', 'q_gallery', 'ruki_vverh'] }); 
                localStorage.setItem('club_role', 'admin'); 
                localStorage.setItem('club_name', 'Admin'); 
                localStorage.setItem('club_phone', 'ADMIN'); 
                return; 
            } 
            if (val.length >= 10) { 
                const userDoc = await db.collection('users').doc(val).get(); 
                if (!userDoc.exists) {
                    let name = prompt(state.lang === 'ru' ? "Имя промоутера:" : "שם יחצן:"); 
                    if (!name) return; 
                    await db.collection('users').doc(val).set({ 
                        name: name.trim(), 
                        phone: val, 
                        status: 'pending', 
                        allowedVenues: [],
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }); 
                    alert(state.lang === 'ru' ? "Заявка отправлена. Ожидайте подтверждения." : "פרטיך נשלחו בהצלחה! המתן לאישור מנהל לפני שתוכל להתחבר.");
                    return;
                } else {
                    const uData = userDoc.data();
                    if (uData.status === 'pending') {
                        return alert(state.lang === 'ru' ? "Аккаунт ожидает подтверждения администратора." : "חשבונך עדיין ממתין לאישור מנהל.");
                    }
                    const userAllowed = uData.allowedVenues || [];
                    if (userAllowed.length === 0) {
                        return alert(state.lang === 'ru' ? "Нет разрешенных клубов. Обратитесь к администратору." : "חשבונך מאושר אך טרם הוגדרו עבורך מועדונים מורשים. פנה למנהל.");
                    }
                    updateState({ 
                        role: 'promoter', 
                        userName: uData.name, 
                        phone: val,
                        allowedVenues: userAllowed,
                        venueId: userAllowed.length === 1 ? userAllowed[0] : null
                    }); 
                    localStorage.setItem('club_role', 'promoter'); 
                    localStorage.setItem('club_name', uData.name); 
                    localStorage.setItem('club_phone', val); 
                    localStorage.setItem('club_venues', JSON.stringify(userAllowed));
                }
            } else {
                alert(state.lang === 'ru' ? "Введите корректный номер телефона" : "יש להזין קוד תקין או מספר טלפון בן 10 ספרות");
            }
        }

            localStorage.clear();

                        </div>
                        <div class="grid grid-cols-1 gap-3 w-full max-w-xs">${accessibleVenues.map(v => `<div onclick="updateState({venueId: '${v.id}'})" class="glass-card p-5 rounded-2xl text-center text-lg font-black uppercase border-white/10 cursor-pointer shadow-xl hover:border-amber-500/50 transition-all">${v.name}</div>`).join('')}</div>
                        <button onclick="logout()" class="text-slate-500 hover:text-slate-300 font-bold mt-8 underline text-xs tracking-widest flex items-center gap-2 transition-colors"><i data-lucide="log-out" size="14"></i> ${t('logout')}</button>
                    </div>`; 
                lucide.createIcons(); 
                return; 
            }

            if (!state.isDateConfirmed) { 
                root.innerHTML = `
                    <div class="h-screen p-6 flex flex-col items-center justify-center space-y-6 text-white">
                        ${accessibleVenues.length > 1 ? `<button onclick="updateState({venueId: null})" class="text-amber-500 font-black text-xs border border-amber-500/30 px-5 py-2 rounded-full uppercase flex items-center gap-1"><i data-lucide="arrow-right" size="14"></i> ${t('back')}</button>` : ''}
                        <h2 class="text-2xl font-black text-center uppercase tracking-wide">${t('selectDate')}</h2>
                        <div class="glass-card p-8 rounded-3xl w-full max-w-xs text-center border-white/5 shadow-2xl">
                            <input type="date" value="${state.selectedDate}" onchange="state.selectedDate = this.value; render();" class="w-full bg-slate-900/60 border border-white/20 rounded-2xl p-4 text-white font-black text-xl text-center outline-none focus:border-amber-500 shadow-inner">
                            <button onclick="updateState({isDateConfirmed: true})" class="w-full btn-amber py-4 rounded-xl mt-6 font-black uppercase text-sm shadow-lg">${t('confirm')}</button>
                        </div>
                    </div>`; 
                lucide.createIcons(); 
                return; 
            }
            
            const venue = allVenues.find(v => v.id === state.venueId);

            root.innerHTML = `
                <div class="flex flex-col h-screen overflow-hidden text-white relative">
                    ${state.transferId ? `<div class="transfer-overlay"><div class="glass-card p-6 rounded-3xl w-full max-w-xs text-center space-y-4 border border-white/10"><h3 class="font-black text-amber-500 uppercase">${t('moveBooking')}</h3><div class="flex flex-col gap-2">${accessibleVenues.filter(v => v.id !== state.venueId).map(v => `<button onclick="moveReservation('${state.transferId}', '${v.id}')" class="bg-white/10 p-3 rounded-xl font-black border border-white/10 active:bg-amber-500 active:text-black uppercase text-xs">${v.name}</button>`).join('')}</div><button onclick="updateState({transferId: null})" class="text-slate-400 font-bold pt-2">${t('cancel')}</button></div></div>` : ''}
                    
                    <header class="bg-slate-950/80 backdrop-blur-md px-3 py-2 border-b border-white/[0.06] flex justify-between items-center shadow-lg">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-lg bg-amber-500/20 border border-amber-500/40 flex items-center justify-center">
                                <i data-lucide="crown" size="13" class="text-amber-500"></i>
                            </div>
                            <div class="font-black italic text-sm text-amber-400">${venue.name}</div>
                            <span class="text-[8px] font-mono text-amber-400/80 bg-amber-500/10 px-1 py-0.5 rounded border border-amber-500/20 font-bold">${APP_VERSION}</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="setLanguage(state.lang === 'he' ? 'ru' : 'he')" class="bg-slate-900 border border-white/15 text-amber-400 font-bold text-[10px] px-2 py-1 rounded-lg">
                                ${state.lang === 'he' ? 'RU' : 'עב'}
                            </button>
                            ${accessibleVenues.length > 1 ? `<button onclick="updateState({venueId: null, isDateConfirmed: false})" class="text-amber-400 font-black text-[10px] border border-amber-500/40 px-2 py-1 rounded-lg uppercase hover:bg-amber-500/10">${t('home')}</button>` : ''}
                            <button onclick="logout()" class="text-rose-400 border border-rose-500/30 px-2 py-1 rounded-lg hover:bg-rose-500/10"><i data-lucide="log-out" size="13"></i></button>
                        </div>
                    </header>

                    <main class="flex-1 overflow-y-auto p-2">
                        ${state.showArchiveMGMT ? renderArchiveMGMT() : (state.showUsersMGMT ? renderUsersMGMT() : (state.isAdding ? renderForm() : renderDashboard(state.reservations)))}
                    </main>
                </div>`;
            lucide.createIcons();
        }

        auth.onAuthStateChanged(u => { 
            if(!u) auth.signInAnonymously(); 
            bindDayReservations();
        });

        render();
    </script>
</body>
</html>
