<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fashion-Bar | מפת שולחנות</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            touch-action: none;
        }

        .map-bg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 1.2rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(245, 158, 11, 0.25);
            pointer-events: none;
        }

        /* אזורי מגע שקופים לשולחנות המפה המובנים */
        .table-spot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            background: transparent;
            border-radius: 0.5rem;
            transition: transform 0.1s ease;
        }

        .table-spot:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* שולחן דינמי שנוצר על ידי המשתמש */
        .custom-dynamic-table {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 20;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(30, 27, 20, 0.95) 0%, rgba(10, 10, 12, 0.98) 100%);
            border: 1.5px solid #d97706;
            border-radius: 0.6rem;
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.35), inset 0 0 4px rgba(251, 191, 36, 0.2);
            touch-action: none;
        }

        .custom-dynamic-table.is-dragging {
            cursor: grabbing;
            opacity: 0.85;
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
            z-index: 40;
        }

        .spot-selected {
            outline: 2px solid #f59e0b !important;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.7) !important;
        }

        /* שכבת טקסט שם לקוח */
        .client-label-fixed {
            position: absolute;
            color: #ffffff;
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
            text-shadow: 0 1px 3px #000, 0 0 5px #000;
            pointer-events: none;
            z-index: 25;
            transform: translate(-50%, -50%);
            direction: rtl;
            text-align: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        #select-multi-res {
            font-size: 10px !important;
            line-height: 1.2;
        }
        #select-multi-res option {
            font-size: 10px !important;
            padding: 3px 6px;
        }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-3 flex flex-col items-center pb-24">

    <!-- סרגל עליון עם כפתור הוספת שולחן ואיפוס -->
    <header class="w-full max-w-lg mb-2 flex justify-between items-center glass p-2.5 rounded-2xl">
        <button onclick="goBack()" class="flex items-center gap-1 text-slate-300 hover:text-white font-bold text-xs bg-white/5 px-2.5 py-1.5 rounded-xl border border-white/10">
            <i data-lucide="arrow-right" size="14"></i>
            <span>חזור</span>
        </button>

        <div class="text-center">
            <h1 class="text-xs font-black text-amber-400 tracking-wider">FASHION-BAR</h1>
            <p id="date-display" class="text-[9px] text-slate-400 font-mono font-bold"></p>
        </div>

        <div class="flex items-center gap-1.5">
            <button onclick="createNewDynamicTable()" id="btn-add-table" class="flex items-center gap-1 text-[9px] font-black text-black bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 px-2 py-1 rounded-lg shadow-md transition-all active:scale-95">
                <i data-lucide="plus-circle" size="11"></i>
                <span>+ הוסף שולחן (<span id="custom-count-badge">0</span>/10)</span>
            </button>
            <button onclick="resetAllAssignments()" class="flex items-center gap-1 text-[9px] font-bold text-rose-300 hover:text-white bg-rose-500/20 hover:bg-rose-500/30 px-2 py-1 rounded-lg border border-rose-500/30 transition-colors shadow-sm" title="מחק את כל השיבוצים של תאריך זה">
                <i data-lucide="rotate-ccw" size="11"></i>
                <span>אפס</span>
            </button>
        </div>
    </header>

    <!-- הודעת שיבוץ פעיל -->
    <div id="assign-banner" class="hidden w-full max-w-lg mb-2 bg-amber-500/20 border border-amber-500/50 p-2 rounded-xl text-center">
        <p class="text-xs font-black text-amber-300">בחר שולחנות לשיבוץ: <span id="assign-client-name" class="text-white underline"></span></p>
    </div>

    <!-- מפה -->
    <main class="w-full flex-1 flex items-center justify-center">
        <div class="map-wrapper" id="map-container">
            <img src="fashion-map.png" alt="Fashion-Bar Map" class="map-bg">
            <div id="spots-layer"></div>
            <div id="dynamic-layer"></div>
            <div id="labels-layer"></div>
        </div>
    </main>

    <!-- סרגל בחירה מרובה -->
    <div id="multi-select-bar" class="hidden fixed bottom-3 inset-x-3 max-w-md mx-auto glass border border-amber-500/40 p-3 rounded-2xl shadow-2xl flex items-center justify-between gap-3 z-40 animate-in fade-in slide-in-from-bottom duration-200">
        <div>
            <p class="text-[10px] text-slate-400 font-bold uppercase">שולחנות שנבחרו:</p>
            <p id="selected-tables-text" class="text-sm font-black text-amber-400 font-mono"></p>
        </div>
        <div class="flex gap-1.5">
            <button onclick="clearMultiSelection()" class="px-3 py-1.5 bg-white/10 hover:bg-white/15 text-slate-300 rounded-xl text-xs font-bold transition-colors">
                ביטול
            </button>
            <button onclick="confirmMultiSelection()" class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black rounded-xl text-xs font-black shadow-lg transition-all">
                שבץ הזמנה
            </button>
        </div>
    </div>

    <!-- מודאל פעולות שולחן -->
    <div id="table-modal" class="overlay hidden">
        <div class="glass p-3.5 rounded-3xl w-full max-w-xs text-center space-y-3 border border-amber-500/40 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-white/10 pb-1.5">
                <span class="text-amber-400 font-black text-xs" id="modal-table-title">שולחן</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" size="15"></i></button>
            </div>

            <div id="modal-body" class="text-right space-y-1.5 text-xs"></div>

            <div id="modal-actions" class="pt-1 flex flex-col gap-1.5"></div>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyD2y4clTGDYnZmmO8Gyg0bXqsyafF-a_GI",
            authDomain: "clubpro-system.firebaseapp.com",
            projectId: "clubpro-system",
            storageBucket: "clubpro-system.firebasestorage.app",
            messagingSenderId: "825897406218",
            appId: "1:825897406218:web:a660e48a120361247934f3"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const selectedDate = urlParams.get('date') || localStorage.getItem('last_date') || new Date().toLocaleDateString('sv-SE');
        const assignToId = urlParams.get('assignTo') || null;

        document.getElementById('date-display').innerText = 'תאריך: ' + selectedDate.split('-').reverse().join('.');

        // הגדרת השולחנות המובנים של המפה
        const BASE_TABLES_DEF = [
            { id: "250", top: "11.5%", left: "13.5%", w: "12%", h: "7.5%", cap: 8, label: "250", labelX: "13.5%", labelY: "18.2%" },
            { id: "240", top: "11.5%", left: "29.5%", w: "10.5%", h: "7.5%", cap: 9, label: "240", labelX: "29.5%", labelY: "18.2%" },
            { id: "230", top: "11.5%", left: "51%", w: "18%", h: "7.5%", cap: 12, label: "230", labelX: "51%", labelY: "19.8%" },
            { id: "220", top: "11.5%", left: "72.5%", w: "10.5%", h: "7.5%", cap: 10, label: "220", labelX: "72.5%", labelY: "19.8%" },
            { id: "210", top: "11.5%", left: "87%", w: "10.5%", h: "7.5%", cap: 9, label: "210", labelX: "87%", labelY: "6.8%" },

            { id: "30", top: "26.5%", left: "49.5%", w: "12%", h: "6%", cap: 5, label: "30", labelX: "49.5%", labelY: "33.2%" },

            { id: "310", top: "29.5%", left: "13.5%", w: "11.5%", h: "6.2%", cap: 9, label: "310", labelX: "13.5%", labelY: "25.2%" },
            { id: "320", top: "36.8%", left: "13.5%", w: "11.5%", h: "6.2%", cap: 9, label: "320", labelX: "13.5%", labelY: "43.2%" },
            { id: "330", top: "50%", left: "13.5%", w: "11.5%", h: "6.2%", cap: 10, label: "330", labelX: "13.5%", labelY: "45.8%" },
            { id: "340", top: "57.3%", left: "13.5%", w: "11.5%", h: "6.2%", cap: 10, label: "340", labelX: "13.5%", labelY: "63.8%" },
            { id: "350", top: "71.5%", left: "13.5%", w: "11.5%", h: "6.2%", cap: 10, label: "350", labelX: "13.5%", labelY: "66.8%" },
            { id: "360", top: "78.8%", left: "13.5%", w: "11.5%", h: "6.2%", cap: 10, label: "360", labelX: "13.5%", labelY: "84.8%" },

            { id: "160", top: "40.5%", left: "86.5%", w: "11.5%", h: "5.8%", cap: 7, label: "160", labelX: "86.5%", labelY: "36.2%" },
            { id: "150", top: "47%", left: "86.5%", w: "11.5%", h: "5.8%", cap: 7, label: "150", labelX: "86.5%", labelY: "53.2%" },
            { id: "140", top: "59%", left: "86.5%", w: "11.5%", h: "5.8%", cap: 10, label: "140", labelX: "86.5%", labelY: "54.8%" },
            { id: "130", top: "65.5%", left: "86.5%", w: "11.5%", h: "5.8%", cap: 10, label: "130", labelX: "86.5%", labelY: "71.8%" },
            { id: "120", top: "76.5%", left: "86.5%", w: "11.5%", h: "5.8%", cap: 7, label: "120", labelX: "68.5%", labelY: "77.5%" },
            { id: "110", top: "83%", left: "86.5%", w: "11.5%", h: "5.8%", cap: 7, label: "110", labelX: "68.5%", labelY: "85.2%" },

            { id: "40", top: "36%", left: "26.5%", w: "8.5%", h: "6%", cap: 4, label: "40", labelX: "26.5%", labelY: "43.5%" },
            { id: "50", top: "51.5%", left: "26.5%", w: "8.5%", h: "6%", cap: 4, label: "50", labelX: "26.5%", labelY: "59.0%" },
            { id: "60", top: "67%", left: "26.5%", w: "8.5%", h: "6%", cap: 4, label: "60", labelX: "26.5%", labelY: "74.5%" },
            { id: "20", top: "36%", left: "72.5%", w: "8.5%", h: "6%", cap: 4, label: "20", labelX: "72.5%", labelY: "29.5%" },
            { id: "10", top: "67%", left: "72.5%", w: "8.5%", h: "6%", cap: 4, label: "10", labelX: "63.5%", labelY: "67.0%" }
        ];

        let reservations = [];
        let customTables = [];
        let assignTargetRes = null;
        let selectedTableIds = [];

        function goBack() {
            window.location.href = `index.html`;
        }

        function getFirstNameOnly(fullName) {
            if (!fullName) return '';
            const cleaned = fullName.trim();
            return cleaned.split(/\s+/)[0];
        }

        function getAllTablesDef() {
            const dynamicMapped = customTables.map(ct => ({
                id: ct.tableNumber,
                top: `${ct.topPercent}%`,
                left: `${ct.leftPercent}%`,
                w: "8.5%",
                h: "6%",
                cap: ct.capacity || 4,
                label: ct.tableNumber,
                isCustom: true,
                docId: ct.id,
                labelX: `${ct.leftPercent}%`,
                labelY: `${ct.topPercent + 4.2}%`
            }));
            return [...BASE_TABLES_DEF, ...dynamicMapped];
        }

        function getReservationForTable(tblId) {
            return reservations.find(r => {
                if (!r.tableNumber) return false;
                const tables = String(r.tableNumber).split(',').map(s => s.trim());
                return tables.includes(String(tblId));
            });
        }

        function initData() {
            // האזנה להזמנות פעילות
            db.collection('reservations')
                .where('venueId', '==', 'shalvata')
                .where('eventDate', '==', selectedDate)
                .onSnapshot(snap => {
                    reservations = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(r => r.status === 'active');

                    if (assignToId) {
                        assignTargetRes = reservations.find(r => r.id === assignToId);
                        if (assignTargetRes) {
                            document.getElementById('assign-banner').classList.remove('hidden');
                            document.getElementById('assign-client-name').innerText = `${assignTargetRes.name} (${assignTargetRes.pax} איש)`;
                        }
                    }

                    renderMap();
                });

            // האזנה לשולחנות דינמיים מותאמים אישית
            db.collection('custom_tables')
                .where('venueId', '==', 'shalvata')
                .onSnapshot(snap => {
                    customTables = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    document.getElementById('custom-count-badge').innerText = customTables.length;
                    
                    const btnAdd = document.getElementById('btn-add-table');
                    if (customTables.length >= 10) {
                        btnAdd.classList.add('opacity-50', 'pointer-events-none');
                    } else {
                        btnAdd.classList.remove('opacity-50', 'pointer-events-none');
                    }

                    renderMap();
                });
        }

        function renderMap() {
            const spotsContainer = document.getElementById('spots-layer');
            const dynamicContainer = document.getElementById('dynamic-layer');
            const labelsContainer = document.getElementById('labels-layer');
            
            spotsContainer.innerHTML = '';
            dynamicContainer.innerHTML = '';
            labelsContainer.innerHTML = '';

            const allTables = getAllTablesDef();

            allTables.forEach(tbl => {
                const occupiedRes = getReservationForTable(tbl.id);
                const isOccupied = !!occupiedRes;
                const isSelected = selectedTableIds.includes(String(tbl.id));

                if (tbl.isCustom) {
                    // שולחן מותאם אישית שניתן לגרירה
                    const dynamicEl = document.createElement('div');
                    dynamicEl.className = `custom-dynamic-table ${isSelected ? 'spot-selected' : ''}`;
                    dynamicEl.style.top = tbl.top;
                    dynamicEl.style.left = tbl.left;
                    dynamicEl.style.width = tbl.w;
                    dynamicEl.style.height = tbl.h;
                    dynamicEl.id = `dyn-${tbl.docId}`;

                    dynamicEl.innerHTML = `
                        <span class="text-[10px] font-black text-amber-400 font-mono leading-none">${tbl.label}</span>
                        <span class="text-[7.5px] font-bold text-slate-400 leading-none mt-0.5">איש ${tbl.cap}</span>
                    `;

                    makeElementDraggable(dynamicEl, tbl);
                    dynamicContainer.appendChild(dynamicEl);
                } else {
                    // שולחן מובנה של המפה
                    const spot = document.createElement('div');
                    spot.className = `table-spot ${isSelected ? 'spot-selected' : ''}`;
                    spot.style.top = tbl.top;
                    spot.style.left = tbl.left;
                    spot.style.width = tbl.w;
                    spot.style.height = tbl.h;
                    spot.onclick = () => handleTableClick(tbl, occupiedRes);
                    spotsContainer.appendChild(spot);
                }

                // שכבת שם לקוח מילה ראשונה
                if (isOccupied) {
                    const label = document.createElement('span');
                    label.className = 'client-label-fixed';
                    label.style.left = tbl.labelX;
                    label.style.top = tbl.labelY;
                    label.innerText = getFirstNameOnly(occupiedRes.name);
                    label.title = `${occupiedRes.name} (${tbl.label})`;
                    labelsContainer.appendChild(label);
                }
            });

            updateMultiSelectBar();
        }

        // מנגנון גרירה מדויק באחוזים (תמיכה מלאה במסך מגע ועכבר)
        function makeElementDraggable(elmnt, tableDef) {
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;
            let isDragged = false;

            const mapWrapper = document.getElementById('map-container');

            const onPointerDown = (e) => {
                isDragged = false;
                elmnt.setPointerCapture(e.pointerId);
                elmnt.classList.add('is-dragging');

                startX = e.clientX;
                startY = e.clientY;

                initialLeft = parseFloat(tableDef.left);
                initialTop = parseFloat(tableDef.top);

                elmnt.addEventListener('pointermove', onPointerMove);
                elmnt.addEventListener('pointerup', onPointerUp);
                elmnt.addEventListener('pointercancel', onPointerUp);
            };

            const onPointerMove = (e) => {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;

                if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
                    isDragged = true;
                }

                const rect = mapWrapper.getBoundingClientRect();
                const deltaPercentX = (deltaX / rect.width) * 100;
                const deltaPercentY = (deltaY / rect.height) * 100;

                let newLeft = Math.max(5, Math.min(95, initialLeft + deltaPercentX));
                let newTop = Math.max(5, Math.min(95, initialTop + deltaPercentY));

                elmnt.style.left = `${newLeft.toFixed(1)}%`;
                elmnt.style.top = `${newTop.toFixed(1)}%`;
            };

            const onPointerUp = async (e) => {
                elmnt.releasePointerCapture(e.pointerId);
                elmnt.classList.remove('is-dragging');
                elmnt.removeEventListener('pointermove', onPointerMove);
                elmnt.removeEventListener('pointerup', onPointerUp);
                elmnt.removeEventListener('pointercancel', onPointerUp);

                if (isDragged) {
                    // שמירת המיקום החדש ב-Firebase
                    const newLeft = parseFloat(elmnt.style.left);
                    const newTop = parseFloat(elmnt.style.top);

                    await db.collection('custom_tables').doc(tableDef.docId).update({
                        leftPercent: Math.round(newLeft * 10) / 10,
                        topPercent: Math.round(newTop * 10) / 10
                    });
                } else {
                    // לחיצה רגילה - פתיחת מודאל או בחירה
                    const occupiedRes = getReservationForTable(tableDef.id);
                    handleTableClick(tableDef, occupiedRes);
                }
            };

            elmnt.addEventListener('pointerdown', onPointerDown);
        }

        // יצירת שולחן דינמי חדש
        async function createNewDynamicTable() {
            if (customTables.length >= 10) {
                alert("הגעת למגבלה של 10 שולחנות נוספים.");
                return;
            }

            // מציאת מספר שולחן פנוי ברירת מחדל (למשל 71, 72 וכו')
            const existingNumbers = getAllTablesDef().map(t => String(t.id));
            let suggestedNumber = 70;
            while (existingNumbers.includes(String(suggestedNumber))) {
                suggestedNumber++;
            }

            const inputNumber = prompt("הזן מספר שולחן חדש:", suggestedNumber);
            if (!inputNumber) return;
            const tableNumStr = inputNumber.trim();

            if (existingNumbers.includes(tableNumStr)) {
                alert(`מספר שולחן ${tableNumStr} כבר קיים במפה!`);
                return;
            }

            const inputCap = prompt("כמות מקומות (תכולת אנשים):", "4");
            const capacity = parseInt(inputCap) || 4;

            // יצירת השולחן במרכז המפה במיקום נוח לתזוזה
            await db.collection('custom_tables').add({
                venueId: 'shalvata',
                tableNumber: tableNumStr,
                capacity: capacity,
                leftPercent: 50.0,
                topPercent: 50.0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function handleTableClick(tbl, occupiedRes) {
            if (occupiedRes) {
                if (selectedTableIds.length > 0 || assignToId) {
                    alert(`שולחן ${tbl.label} משובץ כבר ע"י ${occupiedRes.name}!`);
                    return;
                }
                openModal(tbl, occupiedRes);
                return;
            }

            toggleSelectTable(String(tbl.id));
        }

        function toggleSelectTable(tblId) {
            if (selectedTableIds.includes(tblId)) {
                selectedTableIds = selectedTableIds.filter(id => id !== tblId);
            } else {
                selectedTableIds.push(tblId);
            }
            renderMap();
        }

        function updateMultiSelectBar() {
            const bar = document.getElementById('multi-select-bar');
            const txt = document.getElementById('selected-tables-text');

            if (selectedTableIds.length > 0) {
                bar.classList.remove('hidden');
                txt.innerText = selectedTableIds.join(', ');
            } else {
                bar.classList.add('hidden');
            }
        }

        function clearMultiSelection() {
            selectedTableIds = [];
            renderMap();
        }

        async function confirmMultiSelection() {
            if (selectedTableIds.length === 0) return;
            const tablesStr = selectedTableIds.join(', ');

            if (assignToId && assignTargetRes) {
                if (confirm(`לשבץ את ${assignTargetRes.name} לשולחנות: ${tablesStr}?`)) {
                    await db.collection('reservations').doc(assignToId).update({
                        tableNumber: tablesStr,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    window.location.href = 'index.html';
                }
                return;
            }

            openMultiAssignModal(tablesStr);
        }

        function openMultiAssignModal(tablesStr) {
            const modal = document.getElementById('table-modal');
            const title = document.getElementById('modal-table-title');
            const body = document.getElementById('modal-body');
            const actions = document.getElementById('modal-actions');

            title.innerText = `שיבוץ שולחנות: ${tablesStr}`;

            body.innerHTML = `
                <div class="bg-amber-500/10 py-1 px-2 rounded-xl border border-amber-500/30 text-center mb-1">
                    <p class="text-[10px] font-black text-amber-400">שולחנות: <span class="text-white font-mono">${tablesStr}</span></p>
                </div>
                <label class="font-bold text-slate-300 text-[9px] mb-0.5 block text-right">בחר הזמנה לשיבוץ:</label>
                <select id="select-multi-res" class="w-full bg-slate-900 border border-white/20 rounded-lg py-1 px-1.5 text-white font-bold outline-none focus:border-amber-400">
                    ${reservations.map(r => {
                        const isAssigned = !!r.tableNumber;
                        const label = isAssigned 
                            ? `🟢 ${r.name} (${r.pax}) [ש' ${r.tableNumber}]` 
                            : `🟡 ${r.name} (${r.pax})`;
                        const styleColor = isAssigned ? 'color: #34d399;' : 'color: #fbbf24;';
                        return `<option value="${r.id}" style="${styleColor} background-color: #0b1120;">${label}</option>`;
                    }).join('')}
                </select>
                <div class="flex items-center justify-center gap-3 pt-1 text-[8.5px] text-slate-400">
                    <span class="flex items-center gap-1 text-emerald-400 font-bold">🟢 משובץ</span>
                    <span class="flex items-center gap-1 text-amber-400 font-bold">🟡 לא משובץ</span>
                </div>
            `;

            actions.innerHTML = `
                <button onclick="saveMultiAssign('${tablesStr}')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black py-1.5 rounded-xl font-black text-[11px] uppercase shadow-md transition-colors">
                    אשר שיבוץ
                </button>
                <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1 rounded-xl font-bold text-[10px]">
                    סגור
                </button>
            `;

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        async function saveMultiAssign(tablesStr) {
            const sel = document.getElementById('select-multi-res');
            if (!sel) return;
            const resId = sel.value;

            await db.collection('reservations').doc(resId).update({
                tableNumber: tablesStr,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeModal();
            clearMultiSelection();
        }

        function openModal(tbl, occupiedRes) {
            const modal = document.getElementById('table-modal');
            const title = document.getElementById('modal-table-title');
            const body = document.getElementById('modal-body');
            const actions = document.getElementById('modal-actions');

            title.innerText = `שולחן ${tbl.label} (תכולה: ${tbl.cap} איש)${tbl.isCustom ? ' [נוסף ידנית]' : ''}`;

            if (occupiedRes) {
                const bookedTables = String(occupiedRes.tableNumber).split(',').map(s => s.trim()).join(', ');
                body.innerHTML = `
                    <div class="bg-amber-500/10 p-2.5 rounded-2xl border border-amber-500/30 space-y-1 text-right">
                        <div class="flex items-center justify-between">
                            <span class="text-amber-400 font-black text-xs">שולחנות: ${bookedTables}</span>
                            <span class="text-slate-400 text-[10px] font-mono">${occupiedRes.time || '22:30'}</span>
                        </div>
                        <p class="font-bold text-white text-xs">👤 לקוח: ${occupiedRes.name}</p>
                        <p class="text-slate-300 font-bold text-xs">👥 כמות: ${occupiedRes.pax} איש</p>
                        <p class="text-amber-400 font-black text-xs">💰 מינימום: ₪${occupiedRes.minOrder || 0}</p>
                        ${occupiedRes.phone ? `<p class="text-slate-400 font-mono text-xs">📞 ${occupiedRes.phone}</p>` : ''}
                        ${occupiedRes.notes ? `<p class="text-slate-300 italic bg-white/5 p-1 rounded-xl border border-white/10 mt-0.5 text-[10px]">💬 ${occupiedRes.notes}</p>` : ''}
                    </div>
                `;

                actions.innerHTML = `
                    <button onclick="unassignSingleTable('${occupiedRes.id}', '${tbl.id}', '${tbl.label}')" class="w-full bg-rose-600/80 hover:bg-rose-600 text-white py-1.5 rounded-xl font-black text-xs uppercase shadow-md transition-colors">
                        שחרר שולחן זה (${tbl.label})
                    </button>
                    ${tbl.isCustom ? `
                        <button onclick="deleteCustomTable('${tbl.docId}', '${tbl.label}')" class="w-full bg-red-950/80 border border-red-500/30 text-rose-300 py-1 rounded-xl font-bold text-[10px] transition-colors">
                            מחק שולחן זה מהמפה
                        </button>
                    ` : ''}
                    <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1 rounded-xl font-bold text-[10px]">
                        סגור
                    </button>
                `;
            } else {
                body.innerHTML = `
                    <p class="text-center text-slate-400 text-xs py-2">שולחן זה פנוי כרגע.</p>
                `;

                actions.innerHTML = `
                    ${tbl.isCustom ? `
                        <button onclick="editCustomTableDetails('${tbl.docId}', '${tbl.label}', ${tbl.cap})" class="w-full bg-amber-500/20 text-amber-300 border border-amber-500/30 py-1.5 rounded-xl font-bold text-xs">
                            ערוך מספר שולחן ותכולה
                        </button>
                        <button onclick="deleteCustomTable('${tbl.docId}', '${tbl.label}')" class="w-full bg-rose-600/80 hover:bg-rose-600 text-white py-1.5 rounded-xl font-black text-xs uppercase transition-colors">
                            מחק שולחן זה מהמפה
                        </button>
                    ` : ''}
                    <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1 rounded-xl font-bold text-[10px]">
                        סגור
                    </button>
                `;
            }

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        async function editCustomTableDetails(docId, currentLabel, currentCap) {
            const newLabel = prompt("ערוך מספר שולחן:", currentLabel);
            if (!newLabel) return;
            const newCap = prompt("ערוך כמות מוזמנים:", currentCap);
            const capNum = parseInt(newCap) || currentCap;

            await db.collection('custom_tables').doc(docId).update({
                tableNumber: newLabel.trim(),
                capacity: capNum
            });
            closeModal();
        }

        async function deleteCustomTable(docId, label) {
            if (confirm(`האם למחוק את שולחן ${label} לחלוטין מהמפה?`)) {
                await db.collection('custom_tables').doc(docId).delete();
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById('table-modal').classList.add('hidden');
        }

        async function unassignSingleTable(resId, tableId, tableLabel) {
            const res = reservations.find(r => r.id === resId);
            if (!res) return;

            if (confirm(`לשחרר את שולחן ${tableLabel}?`)) {
                let currentTables = String(res.tableNumber).split(',').map(s => s.trim());
                currentTables = currentTables.filter(id => id !== String(tableId));

                if (currentTables.length > 0) {
                    await db.collection('reservations').doc(resId).update({
                        tableNumber: currentTables.join(', ')
                    });
                } else {
                    await db.collection('reservations').doc(resId).update({
                        tableNumber: firebase.firestore.FieldValue.delete()
                    });
                }
                closeModal();
            }
        }

        async function resetAllAssignments() {
            const assignedCount = reservations.filter(r => r.tableNumber).length;
            if (assignedCount === 0) {
                alert("אין שום שולחנות משובצים כרגע בתאריך זה.");
                return;
            }

            const step1 = confirm(`האם אתה בטוח שברצונך לאפס ולמחוק את השיבוצים של כל ${assignedCount} ההזמנות לתאריך ${selectedDate}?`);
            if (!step1) return;

            const step2 = confirm("אזהרה: פעולה זו תנקה את כל מפת השולחנות לערב זה. להמשיך?");
            if (!step2) return;

            try {
                const batch = db.batch();
                reservations.forEach(r => {
                    if (r.tableNumber) {
                        const ref = db.collection('reservations').doc(r.id);
                        batch.update(ref, { tableNumber: firebase.firestore.FieldValue.delete() });
                    }
                });
                await batch.commit();
                alert("כל השיבוצים אופסו בהצלחה!");
                clearMultiSelection();
            } catch (err) {
                console.error("שגיאה באיפוס שיבוצים:", err);
                alert("אירעה שגיאה בעת איפוס השיבוצים.");
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('table-modal');
            if (event.target === modal) closeModal();
        };

        initData();
        lucide.createIcons();
    </script>
</body>
</html>
