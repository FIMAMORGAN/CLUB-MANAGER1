<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fashion-Bar | מפת שולחנות</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            touch-action: none;
        }

        .map-bg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 1.2rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(245, 158, 11, 0.25);
            pointer-events: none;
        }

        .table-spot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            background: transparent;
            border-radius: 0.35rem;
            transition: background-color 0.15s ease;
        }

        .spot-arrived-bg {
            background-color: rgba(225, 29, 72, 0.28) !important;
            box-shadow: inset 0 0 6px rgba(244, 63, 94, 0.25);
        }

        .spot-drag-hover {
            background-color: rgba(56, 189, 248, 0.35) !important;
            outline: 2px solid #38bdf8 !important;
        }

        .custom-dynamic-table {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 20;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(30, 27, 20, 0.95) 0%, rgba(10, 10, 12, 0.98) 100%);
            border: 1.5px solid #d97706;
            border-radius: 0.5rem;
            box-shadow: 0 0 10px rgba(217, 119, 6, 0.35);
            touch-action: none;
        }

        .custom-dynamic-table.spot-arrived-bg {
            background: radial-gradient(circle, rgba(225, 29, 72, 0.35) 0%, rgba(159, 18, 57, 0.3) 100%) !important;
            border-color: rgba(244, 63, 94, 0.7) !important;
        }

        .custom-dynamic-table.is-dragging {
            cursor: grabbing;
            opacity: 0.85;
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
            z-index: 40;
        }

        .client-label-draggable {
            position: absolute;
            color: #ffffff;
            font-size: 8.5px;
            font-weight: 900;
            white-space: nowrap;
            text-shadow: 0 1px 3px #000, 0 0 5px #000;
            z-index: 35;
            transform: translate(-50%, -50%);
            direction: rtl;
            text-align: center;
            cursor: grab;
            touch-action: none;
            padding: 2px 4px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        .client-label-draggable:active, .client-label-draggable.is-moving {
            cursor: grabbing;
            background: rgba(245, 158, 11, 0.4);
            border-color: #f59e0b;
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 50;
        }

        #guest-drag-strip {
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x !important;
            overscroll-behavior-x: contain;
        }
        #guest-drag-strip::-webkit-scrollbar {
            height: 3px;
        }
        #guest-drag-strip::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 9999px;
        }

        .draggable-guest-badge {
            user-select: none;
            touch-action: pan-x !important;
            will-change: transform;
        }

        /* אלמנט גרירה צף מהיר ומוגבר חומרה */
        .drag-ghost-fast {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none !important;
            opacity: 0.95;
            will-change: transform;
            transform-origin: center center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-3 flex flex-col items-center pb-40">

    <header class="w-full max-w-lg mb-2 flex justify-between items-center glass p-2 rounded-2xl gap-1.5">
        <button onclick="goBack()" class="flex items-center gap-1 text-slate-300 hover:text-white font-bold text-xs bg-white/5 px-2.5 py-1.5 rounded-xl border border-white/10">
            <i data-lucide="arrow-right" size="13"></i>
            <span>חזור</span>
        </button>

        <div class="text-center">
            <h1 class="text-xs font-black text-amber-400 tracking-wider">FASHION-BAR</h1>
            <p id="date-display" class="text-[9px] text-slate-400 font-mono font-bold"></p>
        </div>

        <div class="flex items-center gap-1">
            <button onclick="createNewDynamicTable()" id="btn-add-table" class="flex items-center gap-1 text-[9px] font-black text-black bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 px-2 py-1 rounded-lg shadow transition-all active:scale-95">
                <i data-lucide="plus" size="11"></i>
                <span>שולחן (<span id="custom-count-badge">0</span>/10)</span>
            </button>
            <button onclick="resetAllAssignments()" class="flex items-center gap-1 text-[9px] font-bold text-rose-300 hover:text-white bg-rose-500/20 hover:bg-rose-500/30 px-2 py-1 rounded-lg border border-rose-500/30 transition-colors" title="אפס שיבוצים">
                <i data-lucide="rotate-ccw" size="11"></i>
                <span>איפוס</span>
            </button>
        </div>
    </header>

    <div class="w-full max-w-lg mb-2 flex justify-center items-center gap-3 text-[9.5px] font-bold">
        <span class="flex items-center gap-1 text-slate-400"><span class="w-2 h-2 rounded-full border border-white/30"></span> פנוי</span>
        <span class="flex items-center gap-1 text-amber-400"><span class="w-2 h-2 rounded-full bg-amber-500"></span> משובץ</span>
        <span class="flex items-center gap-1 text-rose-400"><span class="w-2 h-2 rounded-sm bg-rose-500/40 border border-rose-400"></span> רקע אדום = הגיע</span>
    </div>

    <main class="w-full flex-1 flex items-center justify-center">
        <div class="map-wrapper" id="map-container">
            <img src="fashion-map.png" alt="Fashion-Bar Map" class="map-bg">
            <div id="spots-layer"></div>
            <div id="dynamic-layer"></div>
            <div id="labels-layer"></div>
        </div>
    </main>

    <div class="fixed bottom-3 inset-x-2 glass border border-amber-500/30 p-2.5 z-40 max-w-lg mx-auto rounded-3xl shadow-2xl">
        <div class="flex justify-between items-center px-1 mb-1.5 gap-2">
            <span class="text-[10px] font-black text-amber-400 uppercase tracking-wide flex items-center gap-1 shrink-0">
                <i data-lucide="layout-grid" size="12"></i> ממתינים (<span id="unassigned-counter">0</span>):
            </span>
            <input type="text" id="strip-search-input" oninput="onSearchFilterStrip(this.value)" placeholder="חפש לקוח..." 
                   class="bg-slate-900/80 border border-white/10 rounded-lg px-2 py-0.5 text-white text-[10px] outline-none focus:border-amber-400 flex-1 min-w-0">
            <div class="flex items-center gap-1 shrink-0">
                <button onclick="scrollStrip(-180)" class="w-6 h-6 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-slate-300 hover:text-white active:bg-amber-500 active:text-black">
                    <i data-lucide="chevron-right" size="14"></i>
                </button>
                <button onclick="scrollStrip(180)" class="w-6 h-6 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-slate-300 hover:text-white active:bg-amber-500 active:text-black">
                    <i data-lucide="chevron-left" size="14"></i>
                </button>
            </div>
        </div>
        <div id="guest-drag-strip" class="flex gap-2 pb-1 px-1"></div>
    </div>

    <div id="table-modal" class="overlay hidden">
        <div class="glass p-3.5 rounded-3xl w-full max-w-xs text-center space-y-3 border border-amber-500/40 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-white/10 pb-1.5">
                <span class="text-amber-400 font-black text-xs" id="modal-table-title">שולחן</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" size="15"></i></button>
            </div>

            <div id="modal-body" class="text-right space-y-1.5 text-xs"></div>
            <div id="modal-actions" class="pt-1 flex flex-col gap-1.5"></div>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyD2y4clTGDYnZmmO8Gyg0bXqsyafF-a_GI",
            authDomain: "clubpro-system.firebaseapp.com",
            projectId: "clubpro-system",
            storageBucket: "clubpro-system.firebasestorage.app",
            messagingSenderId: "825897406218",
            appId: "1:825897406218:web:a660e48a120361247934f3"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const selectedDate = urlParams.get('date') || localStorage.getItem('last_date') || new Date().toLocaleDateString('sv-SE');

        document.getElementById('date-display').innerText = 'תאריך: ' + selectedDate.split('-').reverse().join('.');

        const BASE_TABLES_DEF = [
            { id: "250", top: "11.2%", left: "13.5%", w: "8.0%", h: "5.2%", cap: 8, label: "250", labelX: "13.5%", labelY: "18.2%" },
            { id: "240", top: "11.2%", left: "29.5%", w: "8.0%", h: "5.2%", cap: 9, label: "240", labelX: "29.5%", labelY: "18.2%" },
            { id: "230", top: "11.2%", left: "51.0%", w: "12.0%", h: "5.2%", cap: 12, label: "230", labelX: "51%", labelY: "19.8%" },
            { id: "220", top: "11.2%", left: "72.5%", w: "8.0%", h: "5.2%", cap: 10, label: "220", labelX: "72.5%", labelY: "19.8%" },
            { id: "210", top: "11.2%", left: "87.0%", w: "8.0%", h: "5.2%", cap: 9, label: "210", labelX: "87%", labelY: "6.8%" },

            { id: "30", top: "26.5%", left: "49.5%", w: "9.2%", h: "4.8%", cap: 5, label: "30", labelX: "49.5%", labelY: "33.2%" },

            { id: "310", top: "29.5%", left: "13.5%", w: "8.2%", h: "4.6%", cap: 9, label: "310", labelX: "13.5%", labelY: "25.2%" },
            { id: "320", top: "36.8%", left: "13.5%", w: "8.2%", h: "4.6%", cap: 9, label: "320", labelX: "13.5%", labelY: "43.2%" },
            { id: "330", top: "50.0%", left: "13.5%", w: "8.2%", h: "4.6%", cap: 10, label: "330", labelX: "13.5%", labelY: "45.8%" },
            { id: "340", top: "57.3%", left: "13.5%", w: "8.2%", h: "4.6%", cap: 10, label: "340", labelX: "13.5%", labelY: "63.8%" },
            { id: "350", top: "71.5%", left: "13.5%", w: "8.2%", h: "4.6%", cap: 10, label: "350", labelX: "13.5%", labelY: "66.8%" },
            { id: "360", top: "78.8%", left: "13.5%", w: "8.2%", h: "4.6%", cap: 10, label: "360", labelX: "13.5%", labelY: "84.8%" },

            { id: "160", top: "40.5%", left: "86.5%", w: "8.2%", h: "4.4%", cap: 7, label: "160", labelX: "86.5%", labelY: "36.2%" },
            { id: "150", top: "47.0%", left: "86.5%", w: "8.2%", h: "4.4%", cap: 7, label: "150", labelX: "86.5%", labelY: "53.2%" },
            { id: "140", top: "59.0%", left: "86.5%", w: "8.2%", h: "4.4%", cap: 10, label: "140", labelX: "86.5%", labelY: "54.8%" },
            { id: "130", top: "65.5%", left: "86.5%", w: "8.2%", h: "4.4%", cap: 10, label: "130", labelX: "86.5%", labelY: "71.8%" },
            { id: "120", top: "76.5%", left: "86.5%", w: "8.2%", h: "4.4%", cap: 7, label: "120", labelX: "68.5%", labelY: "77.5%" },
            { id: "110", top: "83.0%", left: "86.5%", w: "8.2%", h: "4.4%", cap: 7, label: "110", labelX: "68.5%", labelY: "85.2%" },

            { id: "40", top: "36.0%", left: "26.5%", w: "6.8%", h: "4.8%", cap: 4, label: "40", labelX: "26.5%", labelY: "43.5%" },
            { id: "50", top: "51.5%", left: "26.5%", w: "6.8%", h: "4.8%", cap: 4, label: "50", labelX: "26.5%", labelY: "59.0%" },
            { id: "60", top: "67.0%", left: "26.5%", w: "6.8%", h: "4.8%", cap: 4, label: "60", labelX: "26.5%", labelY: "74.5%" },
            { id: "20", top: "36.0%", left: "72.5%", w: "6.8%", h: "4.8%", cap: 4, label: "20", labelX: "72.5%", labelY: "29.5%" },
            { id: "10", top: "67.0%", left: "72.5%", w: "6.8%", h: "4.8%", cap: 4, label: "10", labelX: "63.5%", labelY: "67.0%" }
        ];

        let reservations = [];
        let customTables = [];
        let deletedBaseTableIds = [];
        let stripFilterText = '';

        function goBack() {
            window.location.href = `index.html`;
        }

        function getFirstNameOnly(fullName) {
            if (!fullName) return '';
            return fullName.trim().split(/\s+/)[0];
        }

        function getTableOnlyReservations() {
            return reservations.filter(r => r.type !== 'bar');
        }

        function getAllActiveTablesDef() {
            const activeBase = BASE_TABLES_DEF.filter(bt => !deletedBaseTableIds.includes(String(bt.id)));
            const dynamicMapped = customTables.map(ct => ({
                id: ct.tableNumber,
                top: `${ct.topPercent}%`,
                left: `${ct.leftPercent}%`,
                w: "7.5%",
                h: "5.2%",
                cap: ct.capacity || 4,
                label: ct.tableNumber,
                isCustom: true,
                docId: ct.id,
                labelX: `${ct.leftPercent}%`,
                labelY: `${ct.topPercent + 4.2}%`
            }));
            return [...activeBase, ...dynamicMapped];
        }

        function getReservationForTable(tblId) {
            return reservations.find(r => {
                if (!r.tableNumber) return false;
                const tables = String(r.tableNumber).split(',').map(s => s.trim());
                return tables.includes(String(tblId));
            });
        }

        function initData() {
            db.collection('deleted_tables').doc('shalvata').onSnapshot(doc => {
                deletedBaseTableIds = doc.exists ? (doc.data().tableIds || []) : [];
                renderMap();
            });

            db.collection('reservations')
                .where('venueId', '==', 'shalvata')
                .where('eventDate', '==', selectedDate)
                .onSnapshot(snap => {
                    reservations = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(r => r.status === 'active');
                    renderMap();
                    renderGuestDragStrip();
                });

            db.collection('custom_tables')
                .where('venueId', '==', 'shalvata')
                .onSnapshot(snap => {
                    customTables = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    document.getElementById('custom-count-badge').innerText = customTables.length;
                    renderMap();
                });
        }

        function renderMap() {
            const spotsContainer = document.getElementById('spots-layer');
            const dynamicContainer = document.getElementById('dynamic-layer');
            const labelsContainer = document.getElementById('labels-layer');
            
            spotsContainer.innerHTML = '';
            dynamicContainer.innerHTML = '';
            labelsContainer.innerHTML = '';

            const allTables = getAllActiveTablesDef();

            allTables.forEach(tbl => {
                const occupiedRes = getReservationForTable(tbl.id);
                const isOccupied = !!occupiedRes;
                const hasArrived = isOccupied && occupiedRes.arrived;

                if (tbl.isCustom) {
                    const dynamicEl = document.createElement('div');
                    dynamicEl.className = `custom-dynamic-table ${hasArrived ? 'spot-arrived-bg' : ''}`;
                    dynamicEl.style.top = tbl.top;
                    dynamicEl.style.left = tbl.left;
                    dynamicEl.style.width = tbl.w;
                    dynamicEl.style.height = tbl.h;
                    dynamicEl.dataset.tableId = tbl.id;

                    dynamicEl.innerHTML = `
                        <span class="text-[10px] font-black text-amber-400 font-mono leading-none z-10 pointer-events-none">${tbl.label}</span>
                        <span class="text-[7px] font-bold text-slate-400 leading-none mt-0.5 z-10 pointer-events-none">איש ${tbl.cap}</span>
                    `;

                    makeElementDraggable(dynamicEl, tbl);
                    dynamicContainer.appendChild(dynamicEl);
                } else {
                    const spot = document.createElement('div');
                    spot.className = `table-spot ${hasArrived ? 'spot-arrived-bg' : ''}`;
                    spot.style.top = tbl.top;
                    spot.style.left = tbl.left;
                    spot.style.width = tbl.w;
                    spot.style.height = tbl.h;
                    spot.dataset.tableId = tbl.id;
                    spot.onclick = () => openModal(tbl, occupiedRes);
                    spotsContainer.appendChild(spot);
                }

                if (isOccupied) {
                    const label = document.createElement('div');
                    label.className = 'client-label-draggable';
                    
                    const posX = occupiedRes.labelCustomX !== undefined ? `${occupiedRes.labelCustomX}%` : tbl.labelX;
                    const posY = occupiedRes.labelCustomY !== undefined ? `${occupiedRes.labelCustomY}%` : tbl.labelY;
                    
                    label.style.left = posX;
                    label.style.top = posY;
                    label.innerText = getFirstNameOnly(occupiedRes.name);
                    label.title = `גרור להזזה: ${occupiedRes.name}`;

                    makeLabelDraggable(label, occupiedRes.id, parseFloat(posX), parseFloat(posY));
                    labelsContainer.appendChild(label);
                }
            });
        }

        function makeLabelDraggable(elmnt, resId, initLeft, initTop) {
            let startX = 0, startY = 0;
            let currentLeft = initLeft, currentTop = initTop;
            let isMoved = false;
            const mapWrapper = document.getElementById('map-container');

            elmnt.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                isMoved = false;
                elmnt.setPointerCapture(e.pointerId);
                elmnt.classList.add('is-moving');

                startX = e.clientX;
                startY = e.clientY;

                const onMove = (ev) => {
                    const deltaX = ev.clientX - startX;
                    const deltaY = ev.clientY - startY;

                    if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) isMoved = true;

                    const rect = mapWrapper.getBoundingClientRect();
                    const newLeft = Math.max(3, Math.min(97, currentLeft + (deltaX / rect.width) * 100));
                    const newTop = Math.max(3, Math.min(97, currentTop + (deltaY / rect.height) * 100));

                    elmnt.style.left = `${newLeft.toFixed(1)}%`;
                    elmnt.style.top = `${newTop.toFixed(1)}%`;
                };

                const onUp = async (ev) => {
                    elmnt.releasePointerCapture(ev.pointerId);
                    elmnt.classList.remove('is-moving');
                    elmnt.removeEventListener('pointermove', onMove);
                    elmnt.removeEventListener('pointerup', onUp);
                    elmnt.removeEventListener('pointercancel', onUp);

                    if (isMoved) {
                        const finalX = parseFloat(elmnt.style.left);
                        const finalY = parseFloat(elmnt.style.top);

                        await db.collection('reservations').doc(resId).update({
                            labelCustomX: Math.round(finalX * 10) / 10,
                            labelCustomY: Math.round(finalY * 10) / 10
                        });
                    }
                };

                elmnt.addEventListener('pointermove', onMove);
                elmnt.addEventListener('pointerup', onUp);
                elmnt.addEventListener('pointercancel', onUp);
            });
        }

        function scrollStrip(offset) {
            const strip = document.getElementById('guest-drag-strip');
            if (strip) {
                strip.scrollBy({ left: offset, behavior: 'smooth' });
            }
        }

        function onSearchFilterStrip(val) {
            stripFilterText = (val || '').trim().toLowerCase();
            renderGuestDragStrip();
        }

        function renderGuestDragStrip() {
            const strip = document.getElementById('guest-drag-strip');
            let unassigned = getTableOnlyReservations().filter(r => !r.tableNumber);
            document.getElementById('unassigned-counter').innerText = unassigned.length;

            if (stripFilterText) {
                unassigned = unassigned.filter(r => (r.name && r.name.toLowerCase().includes(stripFilterText)) || (r.phone && r.phone.includes(stripFilterText)));
            }

            if (unassigned.length === 0) {
                strip.innerHTML = `<span class="text-[10px] text-slate-500 py-1.5 px-2 font-bold">${stripFilterText ? 'לא נמצאו לקוחות מתאימים לחיפוש' : 'כל שולחנות האירוע שובצו ✓'}</span>`;
                return;
            }

            strip.innerHTML = unassigned.map(res => `
                <div class="draggable-guest-badge shrink-0 bg-slate-900 border border-amber-500/40 hover:border-amber-400 px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-md active:scale-95 transition-all"
                     data-resid="${res.id}" data-name="${res.name}">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 pointer-events-none"></span>
                    <span class="text-amber-400 font-black text-[11px] whitespace-nowrap pointer-events-none">${res.name}</span>
                    <span class="text-[9px] text-slate-400 font-mono font-bold pointer-events-none">(${res.pax})</span>
                </div>
            `).join('');

            bindDragAndDropGuests();
        }

        // מנגנון גרירה מהיר ומואץ (Zero-Lag Drag & Drop)
        function bindDragAndDropGuests() {
            const items = document.querySelectorAll('.draggable-guest-badge');
            items.forEach(item => {
                let ghost = null;
                let resId = item.dataset.resid;
                let startX = 0, startY = 0;
                let currentX = 0, currentY = 0;
                let isDraggingToTable = false;
                let animFrame = null;
                let lastTarget = null;

                const updateGhostPosition = () => {
                    if (ghost) {
                        ghost.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%) scale(1.08)`;
                        
                        // בדיקת שולחן ממוקדת באמצעות elementFromPoint רק בזמן תנועה פעילה
                        const elemBelow = document.elementFromPoint(currentX, currentY);
                        const tableTarget = elemBelow ? elemBelow.closest('.table-spot, .custom-dynamic-table') : null;

                        if (tableTarget !== lastTarget) {
                            if (lastTarget) lastTarget.classList.remove('spot-drag-hover');
                            if (tableTarget) tableTarget.classList.add('spot-drag-hover');
                            lastTarget = tableTarget;
                        }

                        animFrame = requestAnimationFrame(updateGhostPosition);
                    }
                };

                const onPointerDown = (e) => {
                    startX = e.clientX;
                    startY = e.clientY;
                    currentX = e.clientX;
                    currentY = e.clientY;
                    isDraggingToTable = false;

                    const onPointerMove = (ev) => {
                        currentX = ev.clientX;
                        currentY = ev.clientY;

                        const deltaX = currentX - startX;
                        const deltaY = currentY - startY;

                        // זיהוי גרירה כלפי מעלה לכיוון המפה
                        if (!isDraggingToTable && deltaY < -12 && Math.abs(deltaY) > Math.abs(deltaX)) {
                            isDraggingToTable = true;

                            ghost = item.cloneNode(true);
                            ghost.className = item.className + ' drag-ghost-fast';
                            ghost.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%) scale(1.08)`;
                            document.body.appendChild(ghost);

                            animFrame = requestAnimationFrame(updateGhostPosition);
                        }
                    };

                    const onPointerUp = async (ev) => {
                        window.removeEventListener('pointermove', onPointerMove);
                        window.removeEventListener('pointerup', onPointerUp);
                        window.removeEventListener('pointercancel', onPointerUp);

                        if (animFrame) cancelAnimationFrame(animFrame);

                        if (isDraggingToTable) {
                            if (ghost) {
                                ghost.remove();
                                ghost = null;
                            }

                            if (lastTarget) {
                                lastTarget.classList.remove('spot-drag-hover');
                            }

                            const elemBelow = document.elementFromPoint(ev.clientX, ev.clientY);
                            const tableTarget = elemBelow ? elemBelow.closest('.table-spot, .custom-dynamic-table') : null;

                            if (tableTarget && tableTarget.dataset.tableId) {
                                const targetTableId = tableTarget.dataset.tableId;
                                const occupiedRes = getReservationForTable(targetTableId);
                                if (occupiedRes) {
                                    alert(`שולחן ${targetTableId} כבר תפוס ע"י ${occupiedRes.name}!`);
                                    return;
                                }

                                await db.collection('reservations').doc(resId).update({
                                    tableNumber: String(targetTableId),
                                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            }
                        }
                    };

                    window.addEventListener('pointermove', onPointerMove, { passive: true });
                    window.addEventListener('pointerup', onPointerUp);
                    window.addEventListener('pointercancel', onPointerUp);
                };

                item.addEventListener('pointerdown', onPointerDown);
            });
        }

        function makeElementDraggable(elmnt, tableDef) {
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;
            let isDragged = false;
            const mapWrapper = document.getElementById('map-container');

            elmnt.addEventListener('pointerdown', (e) => {
                isDragged = false;
                elmnt.setPointerCapture(e.pointerId);
                elmnt.classList.add('is-dragging');

                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(tableDef.left);
                initialTop = parseFloat(tableDef.top);

                const onMove = (ev) => {
                    const deltaX = ev.clientX - startX;
                    const deltaY = ev.clientY - startY;
                    if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) isDragged = true;

                    const rect = mapWrapper.getBoundingClientRect();
                    const newLeft = Math.max(5, Math.min(95, initialLeft + (deltaX / rect.width) * 100));
                    const newTop = Math.max(5, Math.min(95, initialTop + (deltaY / rect.height) * 100));

                    elmnt.style.left = `${newLeft.toFixed(1)}%`;
                    elmnt.style.top = `${newTop.toFixed(1)}%`;
                };

                const onUp = async (ev) => {
                    elmnt.releasePointerCapture(ev.pointerId);
                    elmnt.classList.remove('is-dragging');
                    elmnt.removeEventListener('pointermove', onMove);
                    elmnt.removeEventListener('pointerup', onUp);
                    elmnt.removeEventListener('pointercancel', onUp);

                    if (isDragged) {
                        const newLeft = parseFloat(elmnt.style.left);
                        const newTop = parseFloat(elmnt.style.top);
                        await db.collection('custom_tables').doc(tableDef.docId).update({
                            leftPercent: Math.round(newLeft * 10) / 10,
                            topPercent: Math.round(newTop * 10) / 10
                        });
                    } else {
                        const occupiedRes = getReservationForTable(tableDef.id);
                        openModal(tableDef, occupiedRes);
                    }
                };

                elmnt.addEventListener('pointermove', onMove);
                elmnt.addEventListener('pointerup', onUp);
                elmnt.addEventListener('pointercancel', onUp);
            });
        }

        async function createNewDynamicTable() {
            if (customTables.length >= 10) return alert("מקסימום 10 שולחנות נוספים.");
            const existingNumbers = getAllActiveTablesDef().map(t => String(t.id));
            let suggestedNumber = 70;
            while (existingNumbers.includes(String(suggestedNumber))) suggestedNumber++;

            const inputNumber = prompt("הזן מספר שולחן חדש:", suggestedNumber);
            if (!inputNumber) return;
            const tableNumStr = inputNumber.trim();
            if (existingNumbers.includes(tableNumStr)) return alert("מספר שולחן כבר קיים!");

            const inputCap = prompt("כמות מקומות (תכולה):", "4");
            const capacity = parseInt(inputCap) || 4;

            await db.collection('custom_tables').add({
                venueId: 'shalvata',
                tableNumber: tableNumStr,
                capacity: capacity,
                leftPercent: 50.0,
                topPercent: 50.0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function openModal(tbl, occupiedRes) {
            const modal = document.getElementById('table-modal');
            const title = document.getElementById('modal-table-title');
            const body = document.getElementById('modal-body');
            const actions = document.getElementById('modal-actions');

            const hasArrived = occupiedRes && occupiedRes.arrived;
            title.innerText = `שולחן ${tbl.label} (תכולה: ${tbl.cap} איש)`;

            if (occupiedRes) {
                body.innerHTML = `
                    <div class="bg-amber-500/10 p-2.5 rounded-2xl border ${hasArrived ? 'border-rose-500/40 bg-rose-500/10' : 'border-amber-500/30'} space-y-1 text-right">
                        <div class="flex items-center justify-between">
                            <span class="text-amber-400 font-black text-xs">שולחן: ${occupiedRes.tableNumber}</span>
                            <span class="${hasArrived ? 'text-rose-400 font-bold' : 'text-slate-400'} text-[10px] font-mono">
                                ${hasArrived ? '● הגיע למועדון' : '○ טרם הגיע'}
                            </span>
                        </div>
                        <p class="font-bold text-white text-xs">👤 לקוח: ${occupiedRes.name}</p>
                        <p class="text-slate-300 font-bold text-xs">👥 כמות: ${occupiedRes.pax} איש</p>
                        <p class="text-amber-400 font-black text-xs">💰 מינימום: ₪${occupiedRes.minOrder || 0}</p>
                        ${occupiedRes.phone ? `<p class="text-slate-400 font-mono text-xs">📞 ${occupiedRes.phone}</p>` : ''}
                    </div>
                `;

                actions.innerHTML = `
                    <button onclick="unassignSingleTable('${occupiedRes.id}', '${tbl.label}')" class="w-full bg-rose-600/80 hover:bg-rose-600 text-white py-1.5 rounded-xl font-black text-xs uppercase shadow transition-colors">
                        שחרר שיבוץ שולחן זה
                    </button>
                    <button onclick="deleteAnyTable('${tbl.id}', ${!!tbl.isCustom}, '${tbl.docId || ''}')" class="w-full bg-red-950/80 border border-red-500/30 text-rose-300 py-1 rounded-xl font-bold text-[10px] transition-colors">
                        מחק שולחן זה מהמפה
                    </button>
                    <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1 rounded-xl font-bold text-[10px]">
                        סגור
                    </button>
                `;
            } else {
                const tableGuests = getTableOnlyReservations();
                body.innerHTML = `
                    <p class="text-[10px] text-slate-400 mb-1 text-right font-bold">בחר הזמנה לשיבוץ בשולחן זה:</p>
                    <select id="select-single-res" class="w-full bg-slate-900 border border-white/20 rounded-lg py-1 px-1.5 text-white font-bold outline-none focus:border-amber-400 mb-2">
                        ${tableGuests.map(r => {
                            const isAssigned = !!r.tableNumber;
                            const label = isAssigned 
                                ? `🟢 ${r.name} (${r.pax}) [ש' ${r.tableNumber}]` 
                                : `🟡 ${r.name} (${r.pax})`;
                            const styleColor = isAssigned ? 'color: #34d399;' : 'color: #fbbf24;';
                            return `<option value="${r.id}" style="${styleColor} background-color: #0b1120;">${label}</option>`;
                        }).join('')}
                    </select>
                `;
                actions.innerHTML = `
                    <button onclick="assignSelectedFromModal('${tbl.id}')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black py-1.5 rounded-xl font-black text-xs uppercase shadow transition-colors">
                        שבץ לשולחן ${tbl.label}
                    </button>
                    <button onclick="deleteAnyTable('${tbl.id}', ${!!tbl.isCustom}, '${tbl.docId || ''}')" class="w-full bg-rose-600/80 hover:bg-rose-600 text-white py-1.5 rounded-xl font-black text-xs uppercase transition-colors">
                        מחק שולחן זה מהמפה
                    </button>
                    <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1 rounded-xl font-bold text-[10px]">
                        סגור
                    </button>
                `;
            }

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        async function assignSelectedFromModal(tableId) {
            const sel = document.getElementById('select-single-res');
            if (!sel || !sel.value) return;
            const resId = sel.value;

            await db.collection('reservations').doc(resId).update({
                tableNumber: String(tableId),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            closeModal();
        }

        async function deleteAnyTable(tableId, isCustom, docId) {
            if (!confirm(`האם אתה בטוח שברצונך למחוק את שולחן ${tableId} מהמפה?`)) return;

            if (isCustom && docId) {
                await db.collection('custom_tables').doc(docId).delete();
            } else {
                let updated = [...deletedBaseTableIds, String(tableId)];
                await db.collection('deleted_tables').doc('shalvata').set({ tableIds: updated }, { merge: true });
            }

            const res = getReservationForTable(tableId);
            if (res) {
                await db.collection('reservations').doc(res.id).update({
                    tableNumber: firebase.firestore.FieldValue.delete(),
                    labelCustomX: firebase.firestore.FieldValue.delete(),
                    labelCustomY: firebase.firestore.FieldValue.delete()
                });
            }

            closeModal();
        }

        async function unassignSingleTable(resId, tableLabel) {
            if (confirm(`לשחרר את שולחן ${tableLabel}?`)) {
                await db.collection('reservations').doc(resId).update({
                    tableNumber: firebase.firestore.FieldValue.delete(),
                    labelCustomX: firebase.firestore.FieldValue.delete(),
                    labelCustomY: firebase.firestore.FieldValue.delete()
                });
                closeModal();
            }
        }

        async function resetAllAssignments() {
            const assigned = reservations.filter(r => r.tableNumber);
            if (assigned.length === 0) return alert("אין שולחנות משובצים.");
            if (!confirm(`לאפס את השיבוץ לכל ${assigned.length} ההזמנות?`)) return;

            const batch = db.batch();
            assigned.forEach(r => {
                batch.update(db.collection('reservations').doc(r.id), {
                    tableNumber: firebase.firestore.FieldValue.delete(),
                    labelCustomX: firebase.firestore.FieldValue.delete(),
                    labelCustomY: firebase.firestore.FieldValue.delete()
                });
            });
            await batch.commit();
            alert("כל השיבוצים אופסו!");
        }

        function closeModal() {
            document.getElementById('table-modal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('table-modal');
            if (event.target === modal) closeModal();
        };

        initData();
        lucide.createIcons();
    </script>
</body>
