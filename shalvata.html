<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fashion-Bar | מפת שולחנות</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
        }

        .map-bg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 1.2rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        /* אזורי לחיצה שקופים 100% מעל השולחנות */
        .table-spot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            background: transparent;
            border: none;
            outline: none;
            transition: transform 0.15s ease;
        }

        .table-spot:active {
            transform: translate(-50%, -50%) scale(0.92);
        }

        .spot-free {
            background: transparent;
        }

        .spot-occupied {
            background: transparent;
        }

        /* תגית תפוס סולידית, שקופה ואלגנטית ללא אדום צועק */
        .lock-badge {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(245, 158, 11, 0.45);
            color: #f59e0b;
            font-size: 10px;
            padding: 1.5px 4.5px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-3 flex flex-col items-center">

    <!-- סרגל עליון -->
    <header class="w-full max-w-lg mb-2 flex justify-between items-center glass p-2.5 rounded-2xl">
        <button onclick="goBack()" class="flex items-center gap-1 text-slate-300 hover:text-white font-bold text-xs bg-white/5 px-2.5 py-1.5 rounded-xl border border-white/10">
            <i data-lucide="arrow-right" size="14"></i>
            <span>חזור</span>
        </button>

        <div class="text-center">
            <h1 class="text-xs font-black text-amber-400 tracking-wider">FASHION-BAR</h1>
            <p id="date-display" class="text-[9px] text-slate-400 font-mono font-bold"></p>
        </div>

        <div class="flex items-center gap-1.5">
            <div class="flex items-center gap-1 text-[9px] font-bold text-slate-400 bg-white/5 px-2 py-0.5 rounded-lg border border-white/10">
                <span>✨</span> פנוי
            </div>
            <div class="flex items-center gap-1 text-[9px] font-bold text-amber-400/90 bg-amber-500/10 px-2 py-0.5 rounded-lg border border-amber-500/20">
                <span>🔒</span> תפוס
            </div>
        </div>
    </header>

    <!-- הודעת שיבוץ -->
    <div id="assign-banner" class="hidden w-full max-w-lg mb-2 bg-amber-500/20 border border-amber-500/50 p-2 rounded-xl text-center">
        <p class="text-xs font-black text-amber-300">בחר שולחן עבור: <span id="assign-client-name" class="text-white underline"></span></p>
    </div>

    <!-- מפה -->
    <main class="w-full flex-1 flex items-center justify-center">
        <div class="map-wrapper" id="map-container">
            <img src="fashion-map.png" alt="Fashion-Bar Map" class="map-bg">
            <div id="spots-layer"></div>
        </div>
    </main>

    <!-- מודאל פעולות שולחן -->
    <div id="table-modal" class="overlay hidden">
        <div class="glass p-5 rounded-3xl w-full max-w-xs text-center space-y-4 border border-amber-500/40 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <span class="text-amber-400 font-black text-sm" id="modal-table-title">שולחן</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" size="18"></i></button>
            </div>

            <div id="modal-body" class="text-right space-y-2 text-xs"></div>

            <div id="modal-actions" class="pt-2 flex flex-col gap-2"></div>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyD2y4clTGDYnZmmO8Gyg0bXqsyafF-a_GI",
            authDomain: "clubpro-system.firebaseapp.com",
            projectId: "clubpro-system",
            storageBucket: "clubpro-system.firebasestorage.app",
            messagingSenderId: "825897406218",
            appId: "1:825897406218:web:a660e48a120361247934f3"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const selectedDate = urlParams.get('date') || localStorage.getItem('last_date') || new Date().toLocaleDateString('sv-SE');
        const assignToId = urlParams.get('assignTo') || null;

        document.getElementById('date-display').innerText = 'תאריך: ' + selectedDate.split('-').reverse().join('.');

        const TABLES_DEF = [
            // מתחם עליון
            { id: "250", top: "12%", left: "13.5%", w: "12%", h: "7%", cap: 8, label: "250" },
            { id: "240", top: "12%", left: "29.5%", w: "10%", h: "7%", cap: 9, label: "240" },
            { id: "230", top: "12%", left: "51%", w: "17%", h: "7%", cap: 12, label: "230" },
            { id: "220", top: "12%", left: "72.5%", w: "10%", h: "7%", cap: 10, label: "220" },
            { id: "210", top: "12%", left: "87%", w: "10%", h: "7%", cap: 9, label: "210" },

            // שולחן עליון מרכזי
            { id: "30", top: "26%", left: "49.5%", w: "11%", h: "6%", cap: 5, label: "30" },

            // אגף שמאל
            { id: "310", top: "29%", left: "12.5%", w: "11%", h: "6.5%", cap: 9, label: "310" },
            { id: "320", top: "36.5%", left: "12.5%", w: "11%", h: "6.5%", cap: 9, label: "320" },
            { id: "330", top: "50%", left: "12.5%", w: "11%", h: "6.5%", cap: 10, label: "330" },
            { id: "340", top: "57.5%", left: "12.5%", w: "11%", h: "6.5%", cap: 10, label: "340" },
            { id: "350", top: "71.5%", left: "12.5%", w: "11%", h: "6.5%", cap: 10, label: "350" },
            { id: "360", top: "79%", left: "12.5%", w: "11%", h: "6.5%", cap: 10, label: "360" },

            // אגף ימין
            { id: "160", top: "40.5%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "160" },
            { id: "150", top: "47%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "150" },
            { id: "140", top: "59%", left: "86.5%", w: "11%", h: "5.5%", cap: 10, label: "140" },
            { id: "130", top: "65.5%", left: "86.5%", w: "11%", h: "5.5%", cap: 10, label: "130" },
            { id: "120", top: "76.5%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "120" },
            { id: "110", top: "83%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "110" },

            // עמידה שמאל
            { id: "40", top: "36%", left: "26%", w: "8%", h: "5.5%", cap: 4, label: "40" },
            { id: "50", top: "51.5%", left: "26%", w: "8%", h: "5.5%", cap: 4, label: "50" },
            { id: "60", top: "67%", left: "26%", w: "8%", h: "5.5%", cap: 4, label: "60" },

            // עמידה ימין
            { id: "20", top: "36%", left: "73%", w: "8%", h: "5.5%", cap: 4, label: "20" },
            { id: "10", top: "67%", left: "73%", w: "8%", h: "5.5%", cap: 4, label: "10" }
        ];

        let reservations = [];
        let assignTargetRes = null;

        function goBack() {
            window.location.href = `index.html`;
        }

        // פונקציית עזר לבדיקה האם שולחן מסוים תפוס (תומך במספר בודד, פסיקים או מערך)
        function getReservationForTable(tblId) {
            return reservations.find(r => {
                if (!r.tableNumber) return false;
                const tables = String(r.tableNumber).split(',').map(s => s.trim());
                return tables.includes(String(tblId));
            });
        }

        function initData() {
            db.collection('reservations')
                .where('venueId', '==', 'shalvata')
                .where('eventDate', '==', selectedDate)
                .onSnapshot(snap => {
                    reservations = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(r => r.status === 'active');

                    if (assignToId) {
                        assignTargetRes = reservations.find(r => r.id === assignToId);
                        if (assignTargetRes) {
                            document.getElementById('assign-banner').classList.remove('hidden');
                            document.getElementById('assign-client-name').innerText = `${assignTargetRes.name} (${assignTargetRes.pax} איש)`;
                        }
                    }

                    renderSpots();
                });
        }

        function renderSpots() {
            const container = document.getElementById('spots-layer');
            container.innerHTML = '';

            TABLES_DEF.forEach(tbl => {
                const occupiedRes = getReservationForTable(tbl.id);
                const isOccupied = !!occupiedRes;

                const spot = document.createElement('div');
                spot.className = `table-spot ${isOccupied ? 'spot-occupied' : 'spot-free'}`;
                spot.style.top = tbl.top;
                spot.style.left = tbl.left;
                spot.style.width = tbl.w;
                spot.style.height = tbl.h;

                if (isOccupied) {
                    spot.innerHTML = `<span class="lock-badge">🔒</span>`;
                }

                spot.onclick = () => handleTableClick(tbl, occupiedRes);
                container.appendChild(spot);
            });
        }

        async function handleTableClick(tbl, occupiedRes) {
            if (assignToId && assignTargetRes) {
                if (occupiedRes) {
                    alert(`שולחן ${tbl.label} כבר תפוס על ידי ${occupiedRes.name}.`);
                    return;
                }

                const currentTables = assignTargetRes.tableNumber ? String(assignTargetRes.tableNumber).split(',').map(s => s.trim()).filter(Boolean) : [];
                currentTables.push(String(tbl.id));
                const newTableString = currentTables.join(', ');

                const wantMore = confirm(`שולחן ${tbl.label} שובץ ל-${assignTargetRes.name}!\n\nהאם ברצונך לשריין שולחן נוסף לאותה הזמנה?`);

                await db.collection('reservations').doc(assignToId).update({
                    tableNumber: newTableString,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                if (!wantMore) {
                    window.location.href = 'index.html';
                }
                return;
            }

            openModal(tbl, occupiedRes);
        }

        function openModal(tbl, occupiedRes) {
            const modal = document.getElementById('table-modal');
            const title = document.getElementById('modal-table-title');
            const body = document.getElementById('modal-body');
            const actions = document.getElementById('modal-actions');

            title.innerText = `שולחן ${tbl.label} (תכולה: ${tbl.cap} איש)`;

            if (occupiedRes) {
                const bookedTables = String(occupiedRes.tableNumber).split(',').map(s => s.trim()).join(', ');
                body.innerHTML = `
                    <div class="bg-amber-500/10 p-3.5 rounded-2xl border border-amber-500/30 space-y-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-amber-400 font-black text-xs">🔒 שולחן משוריין (${bookedTables})</span>
                            <span class="text-slate-400 text-[10px] font-mono">${occupiedRes.time || '22:30'}</span>
                        </div>
                        <p class="font-bold text-white text-sm">👤 לקוח: ${occupiedRes.name}</p>
                        <p class="text-slate-300 font-bold">👥 כמות: ${occupiedRes.pax} איש</p>
                        <p class="text-amber-400 font-black">💰 מינימום: ₪${occupiedRes.minOrder || 0}</p>
                        ${occupiedRes.phone ? `<p class="text-slate-400 font-mono">📞 ${occupiedRes.phone}</p>` : ''}
                        ${occupiedRes.notes ? `<p class="text-slate-300 italic bg-white/5 p-2 rounded-xl border border-white/10 mt-1">💬 ${occupiedRes.notes}</p>` : ''}
                    </div>
                `;

                actions.innerHTML = `
                    <button onclick="unassignSingleTable('${occupiedRes.id}', '${tbl.id}', '${tbl.label}')" class="w-full bg-rose-600/80 hover:bg-rose-600 text-white py-2.5 rounded-xl font-black text-xs uppercase shadow-lg transition-colors">
                        שחרר שולחן זה (${tbl.label})
                    </button>
                    <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1.5 rounded-xl font-bold text-xs">
                        סגור
                    </button>
                `;
            } else {
                body.innerHTML = `
                    <div class="bg-emerald-500/10 p-3 rounded-2xl border border-emerald-500/20 text-center">
                        <p class="font-bold text-emerald-400 text-sm">השולחן פנוי</p>
                        <p class="text-slate-400 text-[10px] mt-1">מתאים לעד ${tbl.cap} מוזמנים</p>
                    </div>
                `;

                // מציג גם הזמנות ללא שולחן וגם הזמנות קיימות שאולי רוצות שולחן שני
                body.innerHTML += `
                    <p class="font-bold text-slate-300 text-xs mt-3 mb-1">שבץ הזמנה לשולחן ${tbl.label}:</p>
                    <select id="select-res-to-assign" class="w-full bg-slate-900 border border-white/20 rounded-xl p-2.5 text-white font-bold text-xs outline-none">
                        ${reservations.map(r => {
                            const current = r.tableNumber ? ` (משוריין: ש' ${r.tableNumber})` : ' (ממתין לשיבוץ)';
                            return `<option value="${r.id}">${r.name} (${r.pax} איש)${current}</option>`;
                        }).join('')}
                    </select>
                `;

                actions.innerHTML = `
                    <button onclick="assignSelectedRes('${tbl.id}', '${tbl.label}')" class="w-full bg-amber-500 hover:bg-amber-400 text-black py-2.5 rounded-xl font-black text-xs uppercase shadow-lg transition-colors">
                        שבץ שולחן זה להזמנה
                    </button>
                    <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1.5 rounded-xl font-bold text-xs">
                        סגור
                    </button>
                `;
            }

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('table-modal').classList.add('hidden');
        }

        // שחרור של שולחן ספציפי (מאפשר שחרור שולחן בודד מתוך 2 משוריינים)
        async function unassignSingleTable(resId, tableId, tableLabel) {
            const res = reservations.find(r => r.id === resId);
            if (!res) return;

            if (confirm(`לשחרר את שולחן ${tableLabel}?`)) {
                let currentTables = String(res.tableNumber).split(',').map(s => s.trim());
                currentTables = currentTables.filter(id => id !== String(tableId));

                if (currentTables.length > 0) {
                    await db.collection('reservations').doc(resId).update({
                        tableNumber: currentTables.join(', ')
                    });
                } else {
                    await db.collection('reservations').doc(resId).update({
                        tableNumber: firebase.firestore.FieldValue.delete()
                    });
                }
                closeModal();
            }
        }

        // שיבוץ שולחן להזמנה (תומך גם בשולחן ראשון וגם בהוספת שולחן שני)
        async function assignSelectedRes(tableId, tableLabel) {
            const selectEl = document.getElementById('select-res-to-assign');
            if (!selectEl) return;
            const resId = selectEl.value;
            const res = reservations.find(r => r.id === resId);
            if (!res) return;

            let currentTables = res.tableNumber ? String(res.tableNumber).split(',').map(s => s.trim()).filter(Boolean) : [];
            if (!currentTables.includes(String(tableId))) {
                currentTables.push(String(tableId));
            }

            await db.collection('reservations').doc(resId).update({
                tableNumber: currentTables.join(', '),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeModal();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('table-modal');
            if (event.target === modal) closeModal();
        };

        initData();
        lucide.createIcons();
    </script>
</body>
</html>
