<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fashion-Bar | מפת שולחנות</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
        }

        .map-bg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 1.2rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        /* שטח לחיצה אינטראקטיבי שקוף */
        .table-spot {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            background: transparent;
            border-radius: 0.5rem;
            transition: all 0.15s ease;
        }

        .table-spot:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* הילה זהובה עדינה בבחירה מרובה */
        .spot-selected {
            outline: 1.5px solid #f59e0b !important;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.6) !important;
        }

        /* עיצוב שם לקוח נקי, שקוף, ללא קופסאות שחורות אטומות */
        .client-label {
            position: absolute;
            color: #38bdf8; /* תכלת ניאון קרח עדין */
            font-size: 7.5px;
            font-weight: 800;
            white-space: nowrap;
            max-width: 55px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px #000, 0 0 5px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 30;
            letter-spacing: -0.2px;
            background: transparent;
        }

        /* כיווני מיקום חכמים לפי השטח הפנוי סביב השולחן */
        .pos-under   { top: 100%; left: 50%; transform: translate(-50%, 2px); }
        .pos-bottom  { bottom: -13px; left: 50%; transform: translateX(-50%); }
        .pos-left    { top: 50%; left: -50px; transform: translateY(-50%); }
        .pos-right   { top: 50%; right: -50px; transform: translateY(-50%); }
        .pos-sofa-in { bottom: 2px; left: 50%; transform: translateX(-50%); font-size: 7px; color: #7dd3fc; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
    </style>
</head>
<body class="min-h-screen p-2 sm:p-3 flex flex-col items-center pb-24">

    <!-- סרגל עליון -->
    <header class="w-full max-w-lg mb-2 flex justify-between items-center glass p-2.5 rounded-2xl">
        <button onclick="goBack()" class="flex items-center gap-1 text-slate-300 hover:text-white font-bold text-xs bg-white/5 px-2.5 py-1.5 rounded-xl border border-white/10">
            <i data-lucide="arrow-right" size="14"></i>
            <span>חזור</span>
        </button>

        <div class="text-center">
            <h1 class="text-xs font-black text-amber-400 tracking-wider">FASHION-BAR</h1>
            <p id="date-display" class="text-[9px] text-slate-400 font-mono font-bold"></p>
        </div>

        <div class="flex items-center gap-1.5">
            <div class="flex items-center gap-1 text-[9px] font-bold text-slate-400 bg-white/5 px-2 py-0.5 rounded-lg border border-white/10">
                <span>פנוי</span>
            </div>
            <div class="flex items-center gap-1 text-[9px] font-bold text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded-lg border border-sky-500/20">
                <span>משובץ</span>
            </div>
        </div>
    </header>

    <!-- הודעת שיבוץ פעיל -->
    <div id="assign-banner" class="hidden w-full max-w-lg mb-2 bg-amber-500/20 border border-amber-500/50 p-2 rounded-xl text-center">
        <p class="text-xs font-black text-amber-300">בחר שולחנות לשיבוץ: <span id="assign-client-name" class="text-white underline"></span></p>
    </div>

    <!-- מפה -->
    <main class="w-full flex-1 flex items-center justify-center">
        <div class="map-wrapper" id="map-container">
            <img src="fashion-map.png" alt="Fashion-Bar Map" class="map-bg">
            <div id="spots-layer"></div>
        </div>
    </main>

    <!-- סרגל בחירה מרובה -->
    <div id="multi-select-bar" class="hidden fixed bottom-3 inset-x-3 max-w-md mx-auto glass border border-amber-500/40 p-3 rounded-2xl shadow-2xl flex items-center justify-between gap-3 z-40 animate-in fade-in slide-in-from-bottom duration-200">
        <div>
            <p class="text-[10px] text-slate-400 font-bold uppercase">שולחנות שנבחרו:</p>
            <p id="selected-tables-text" class="text-sm font-black text-amber-400 font-mono"></p>
        </div>
        <div class="flex gap-1.5">
            <button onclick="clearMultiSelection()" class="px-3 py-1.5 bg-white/10 hover:bg-white/15 text-slate-300 rounded-xl text-xs font-bold transition-colors">
                ביטול
            </button>
            <button onclick="confirmMultiSelection()" class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black rounded-xl text-xs font-black shadow-lg transition-all">
                שבץ הזמנה
            </button>
        </div>
    </div>

    <!-- מודאל פעולות שולחן -->
    <div id="table-modal" class="overlay hidden">
        <div class="glass p-5 rounded-3xl w-full max-w-xs text-center space-y-4 border border-amber-500/40 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <span class="text-amber-400 font-black text-sm" id="modal-table-title">שולחן</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" size="18"></i></button>
            </div>

            <div id="modal-body" class="text-right space-y-2 text-xs"></div>

            <div id="modal-actions" class="pt-2 flex flex-col gap-2"></div>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyD2y4clTGDYnZmmO8Gyg0bXqsyafF-a_GI",
            authDomain: "clubpro-system.firebaseapp.com",
            projectId: "clubpro-system",
            storageBucket: "clubpro-system.firebasestorage.app",
            messagingSenderId: "825897406218",
            appId: "1:825897406218:web:a660e48a120361247934f3"
        };
        firebase.initializeApp(config);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const selectedDate = urlParams.get('date') || localStorage.getItem('last_date') || new Date().toLocaleDateString('sv-SE');
        const assignToId = urlParams.get('assignTo') || null;

        document.getElementById('date-display').innerText = 'תאריך: ' + selectedDate.split('-').reverse().join('.');

        // הגדרה יצירתית של מיקומי השמות:
        // שולחנות עמידה (10, 20, 40, 50, 60) מקבלים pos: "pos-under" (בדיוק מתחת לרגל השולחן, אפס גלישה לבר!)
        // ספות ימין מקבלות pos-sofa-in או pos-left במרחק מותאם
        const TABLES_DEF = [
            // מתחם עליון
            { id: "250", top: "12%", left: "13.5%", w: "12%", h: "7.5%", cap: 8, label: "250", pos: "pos-bottom" },
            { id: "240", top: "12%", left: "29.5%", w: "10.5%", h: "7.5%", cap: 9, label: "240", pos: "pos-bottom" },
            { id: "230", top: "12%", left: "51%", w: "18%", h: "7.5%", cap: 12, label: "230", pos: "pos-bottom" },
            { id: "220", top: "12%", left: "72.5%", w: "10.5%", h: "7.5%", cap: 10, label: "220", pos: "pos-bottom" },
            { id: "210", top: "12%", left: "87%", w: "10.5%", h: "7.5%", cap: 9, label: "210", pos: "pos-bottom" },

            // שולחן עליון מרכזי
            { id: "30", top: "26%", left: "49.5%", w: "12%", h: "6%", cap: 5, label: "30", pos: "pos-bottom" },

            // ספות שמאל (במעבר המרכזי צמוד לספה)
            { id: "310", top: "29%", left: "13%", w: "11%", h: "6%", cap: 9, label: "310", pos: "pos-right" },
            { id: "320", top: "36.5%", left: "13%", w: "11%", h: "6%", cap: 9, label: "320", pos: "pos-right" },
            { id: "330", top: "50%", left: "13%", w: "11%", h: "6%", cap: 10, label: "330", pos: "pos-right" },
            { id: "340", top: "57.5%", left: "13%", w: "11%", h: "6%", cap: 10, label: "340", pos: "pos-right" },
            { id: "350", top: "71.5%", left: "13%", w: "11%", h: "6%", cap: 10, label: "350", pos: "pos-right" },
            { id: "360", top: "79%", left: "13%", w: "11%", h: "6%", cap: 10, label: "360", pos: "pos-right" },

            // ספות ימין (משולב בעדינות על פס הבסיס של הספה או במעבר השמאלי ללא מריחה)
            { id: "160", top: "40.5%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "160", pos: "pos-sofa-in" },
            { id: "150", top: "47%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "150", pos: "pos-sofa-in" },
            { id: "140", top: "59%", left: "86.5%", w: "11%", h: "5.5%", cap: 10, label: "140", pos: "pos-sofa-in" },
            { id: "130", top: "65.5%", left: "86.5%", w: "11%", h: "5.5%", cap: 10, label: "130", pos: "pos-sofa-in" },
            { id: "120", top: "76.5%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "120", pos: "pos-sofa-in" },
            { id: "110", top: "83%", left: "86.5%", w: "11%", h: "5.5%", cap: 7, label: "110", pos: "pos-sofa-in" },

            // שולחנות עמידה - השם נכנס ישירות מתחת לשולחן באזור השחור החופשי, 0 דריכה על הבר!
            { id: "40", top: "36%", left: "26.5%", w: "9%", h: "6%", cap: 4, label: "40", pos: "pos-under" },
            { id: "50", top: "51.5%", left: "26.5%", w: "9%", h: "6%", cap: 4, label: "50", pos: "pos-under" },
            { id: "60", top: "67%", left: "26.5%", w: "9%", h: "6%", cap: 4, label: "60", pos: "pos-under" },
            { id: "20", top: "36%", left: "72.5%", w: "9%", h: "6%", cap: 4, label: "20", pos: "pos-under" },
            { id: "10", top: "67%", left: "72.5%", w: "9%", h: "6%", cap: 4, label: "10", pos: "pos-under" }
        ];

        let reservations = [];
        let assignTargetRes = null;
        let selectedTableIds = [];

        function goBack() {
            window.location.href = `index.html`;
        }

        function getReservationForTable(tblId) {
            return reservations.find(r => {
                if (!r.tableNumber) return false;
                const tables = String(r.tableNumber).split(',').map(s => s.trim());
                return tables.includes(String(tblId));
            });
        }

        function initData() {
            db.collection('reservations')
                .where('venueId', '==', 'shalvata')
                .where('eventDate', '==', selectedDate)
                .onSnapshot(snap => {
                    reservations = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(r => r.status === 'active');

                    if (assignToId) {
                        assignTargetRes = reservations.find(r => r.id === assignToId);
                        if (assignTargetRes) {
                            document.getElementById('assign-banner').classList.remove('hidden');
                            document.getElementById('assign-client-name').innerText = `${assignTargetRes.name} (${assignTargetRes.pax} איש)`;
                        }
                    }

                    renderSpots();
                });
        }

        function renderSpots() {
            const container = document.getElementById('spots-layer');
            container.innerHTML = '';

            TABLES_DEF.forEach(tbl => {
                const occupiedRes = getReservationForTable(tbl.id);
                const isOccupied = !!occupiedRes;
                const isSelected = selectedTableIds.includes(String(tbl.id));

                const spot = document.createElement('div');
                spot.className = `table-spot ${isSelected ? 'spot-selected' : ''}`;
                spot.style.top = tbl.top;
                spot.style.left = tbl.left;
                spot.style.width = tbl.w;
                spot.style.height = tbl.h;

                // שם הלקוח מוצג ישירות כטקסט קריסטל נקי ללא תיבות שחורות
                if (isOccupied) {
                    spot.innerHTML = `<span class="client-label ${tbl.pos}">${occupiedRes.name}</span>`;
                }

                spot.onclick = () => handleTableClick(tbl, occupiedRes);
                container.appendChild(spot);
            });

            updateMultiSelectBar();
        }

        function handleTableClick(tbl, occupiedRes) {
            if (occupiedRes) {
                if (selectedTableIds.length > 0 || assignToId) {
                    alert(`שולחן ${tbl.label} משובץ כבר ע"י ${occupiedRes.name}!`);
                    return;
                }
                openModal(tbl, occupiedRes);
                return;
            }

            toggleSelectTable(String(tbl.id));
        }

        function toggleSelectTable(tblId) {
            if (selectedTableIds.includes(tblId)) {
                selectedTableIds = selectedTableIds.filter(id => id !== tblId);
            } else {
                selectedTableIds.push(tblId);
            }
            renderSpots();
        }

        function updateMultiSelectBar() {
            const bar = document.getElementById('multi-select-bar');
            const txt = document.getElementById('selected-tables-text');

            if (selectedTableIds.length > 0) {
                bar.classList.remove('hidden');
                txt.innerText = selectedTableIds.join(', ');
            } else {
                bar.classList.add('hidden');
            }
        }

        function clearMultiSelection() {
            selectedTableIds = [];
            renderSpots();
        }

        async function confirmMultiSelection() {
            if (selectedTableIds.length === 0) return;
            const tablesStr = selectedTableIds.join(', ');

            if (assignToId && assignTargetRes) {
                if (confirm(`לשבץ את ${assignTargetRes.name} לשולחנות: ${tablesStr}?`)) {
                    await db.collection('reservations').doc(assignToId).update({
                        tableNumber: tablesStr,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    window.location.href = 'index.html';
                }
                return;
            }

            openMultiAssignModal(tablesStr);
        }

        function openMultiAssignModal(tablesStr) {
            const modal = document.getElementById('table-modal');
            const title = document.getElementById('modal-table-title');
            const body = document.getElementById('modal-body');
            const actions = document.getElementById('modal-actions');

            title.innerText = `שיבוץ שולחנות: ${tablesStr}`;

            body.innerHTML = `
                <div class="bg-amber-500/10 p-3 rounded-2xl border border-amber-500/30 text-center mb-2">
                    <p class="text-xs font-black text-amber-400">נבחרו שולחנות: <span class="text-white font-mono">${tablesStr}</span></p>
                </div>
                <p class="font-bold text-slate-300 text-xs mb-1">בחר הזמנה לשיבוץ:</p>
                <select id="select-multi-res" class="w-full bg-slate-900 border border-white/20 rounded-xl p-2.5 text-white font-bold text-xs outline-none">
                    ${reservations.map(r => {
                        const current = r.tableNumber ? ` (כרגע: ש' ${r.tableNumber})` : ' (ממתין לשיבוץ)';
                        return `<option value="${r.id}">${r.name} (${r.pax} איש)${current}</option>`;
                    }).join('')}
                </select>
            `;

            actions.innerHTML = `
                <button onclick="saveMultiAssign('${tablesStr}')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black py-2.5 rounded-xl font-black text-xs uppercase shadow-lg transition-colors">
                    אשר שיבוץ
                </button>
                <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1.5 rounded-xl font-bold text-xs">
                    סגור
                </button>
            `;

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        async function saveMultiAssign(tablesStr) {
            const sel = document.getElementById('select-multi-res');
            if (!sel) return;
            const resId = sel.value;

            await db.collection('reservations').doc(resId).update({
                tableNumber: tablesStr,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeModal();
            clearMultiSelection();
        }

        function openModal(tbl, occupiedRes) {
            const modal = document.getElementById('table-modal');
            const title = document.getElementById('modal-table-title');
            const body = document.getElementById('modal-body');
            const actions = document.getElementById('modal-actions');

            title.innerText = `שולחן ${tbl.label} (תכולה: ${tbl.cap} איש)`;

            const bookedTables = String(occupiedRes.tableNumber).split(',').map(s => s.trim()).join(', ');
            body.innerHTML = `
                <div class="bg-amber-500/10 p-3.5 rounded-2xl border border-amber-500/30 space-y-1.5">
                    <div class="flex items-center justify-between">
                        <span class="text-amber-400 font-black text-xs">שולחנות משובצים: ${bookedTables}</span>
                        <span class="text-slate-400 text-[10px] font-mono">${occupiedRes.time || '22:30'}</span>
                    </div>
                    <p class="font-bold text-white text-sm">👤 לקוח: ${occupiedRes.name}</p>
                    <p class="text-slate-300 font-bold">👥 כמות: ${occupiedRes.pax} איש</p>
                    <p class="text-amber-400 font-black">💰 מינימום: ₪${occupiedRes.minOrder || 0}</p>
                    ${occupiedRes.phone ? `<p class="text-slate-400 font-mono">📞 ${occupiedRes.phone}</p>` : ''}
                    ${occupiedRes.notes ? `<p class="text-slate-300 italic bg-white/5 p-2 rounded-xl border border-white/10 mt-1">💬 ${occupiedRes.notes}</p>` : ''}
                </div>
            `;

            actions.innerHTML = `
                <button onclick="unassignSingleTable('${occupiedRes.id}', '${tbl.id}', '${tbl.label}')" class="w-full bg-rose-600/80 hover:bg-rose-600 text-white py-2.5 rounded-xl font-black text-xs uppercase shadow-lg transition-colors">
                    שחרר שולחן זה (${tbl.label})
                </button>
                <button onclick="closeModal()" class="w-full bg-white/5 hover:bg-white/10 text-slate-400 py-1.5 rounded-xl font-bold text-xs">
                    סגור
                </button>
            `;

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('table-modal').classList.add('hidden');
        }

        async function unassignSingleTable(resId, tableId, tableLabel) {
            const res = reservations.find(r => r.id === resId);
            if (!res) return;

            if (confirm(`לשחרר את שולחן ${tableLabel}?`)) {
                let currentTables = String(res.tableNumber).split(',').map(s => s.trim());
                currentTables = currentTables.filter(id => id !== String(tableId));

                if (currentTables.length > 0) {
                    await db.collection('reservations').doc(resId).update({
                        tableNumber: currentTables.join(', ')
                    });
                } else {
                    await db.collection('reservations').doc(resId).update({
                        tableNumber: firebase.firestore.FieldValue.delete()
                    });
                }
                closeModal();
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('table-modal');
            if (event.target === modal) closeModal();
        };

        initData();
        lucide.createIcons();
    </script>
</body>
</html>
